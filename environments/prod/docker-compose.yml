services:

  # ============================================================
  # MySQL
  # ============================================================

  mysql:
    image: mysql:8.4
    container_name: lb-calc-prod-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    ports:
      - "${MYSQL_PORT}:3306"

    volumes:
      - prod_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  # ============================================================
  # Kafka
  # ============================================================

  kafka:
    image: apache/kafka:4.0.0
    container_name: lb-calc-prod-kafka
    restart: unless-stopped

    ports:
      - "${KAFKA_EXTERNAL_PORT}:29092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - prod_kafka_data:/var/lib/kafka/data


  # ============================================================
  # LB Calc Web
  # ============================================================

  lb-calc-web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/lb-calc-web/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION}

    image: lb-calc-web:${APP_VERSION}

    container_name: lb-calc-prod-web
    restart: unless-stopped

    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET_ACCESS: ${JWT_SECRET_ACCESS}
      JWT_SECRET_REFRESH: ${JWT_SECRET_REFRESH}

      JWT_EXPIRATION_ACCESS: ${JWT_EXPIRATION_ACCESS}
      JWT_EXPIRATION_REFRESH: ${JWT_EXPIRATION_REFRESH}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_USER_EVENTS: ${KAFKA_TOPIC_USER_EVENTS}

    ports:
      - "${WEB_PORT}:8081"

    depends_on:
      mysql:
        condition: service_healthy

      kafka:
        condition: service_started


  # ============================================================
  # Notification Service
  # ============================================================

  notification-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/notification-service/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION}

    image: notification-service:${APP_VERSION}

    container_name: lb-calc-prod-notification
    restart: unless-stopped

    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_USER_EVENTS: ${KAFKA_TOPIC_USER_EVENTS}

    ports:
      - "${NOTIFICATION_PORT}:8080"

    depends_on:
      kafka:
        condition: service_started


# ============================================================
# Volumes
# ============================================================

volumes:

  prod_mysql_data:
    name: prod_mysql_data

  prod_kafka_data:
    name: prod_kafka_data