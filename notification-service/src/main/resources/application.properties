spring.application.name=notification-service
server.port=8082

# Общий адрес Kafka задаётся окружением для DEV и TEST.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=notification.event
spring.kafka.consumer.properties.spring.json.value.default.type=notification.event.UserEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
app.kafka.topic.user-events=${KAFKA_TOPIC_USER_EVENTS}
app.kafka.topic.user-events.partitions=${KAFKA_TOPIC_USER_EVENTS_PARTITIONS:3}
