name: Java CI

on:
  push:
    branches:
      - master
      - refactor-main
      - refactor/catalog-column-filters
      - maintenance/master-recovery
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Проверка Java-проекта
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lb_calc_web_ci
          MYSQL_USER: lb_calc_app
          MYSQL_PASSWORD: ci-db-password
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      kafka:
        image: apache/kafka:4.0.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_NUM_PARTITIONS: 3
        options: >-
          --health-cmd="/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=20
          --health-start-period=30s

    env:
      DB_URL: jdbc:mysql://127.0.0.1:3308/lb_calc_web_ci?createDatabaseIfNotExist=true
      DB_USERNAME: lb_calc_app
      DB_PASSWORD: ci-db-password
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      JWT_SECRET_ACCESS: ci-access-secret-not-for-production
      JWT_SECRET_REFRESH: ci-refresh-secret-not-for-production
      KAFKA_TOPIC_USER_EVENTS: user-events-topic
      KAFKA_TOPIC_USER_EVENTS_PARTITIONS: 3
      LOGGING_LEVEL_COM_LB_CALC_WEB: INFO

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Настроить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Проверить метку версии PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const allowedLabels = [
              'version:patch',
              'version:minor',
              'version:major'
            ];
            const labels = context.payload.pull_request.labels
              .map(label => label.name)
              .filter(name => allowedLabels.includes(name));

            if (labels.length !== 1) {
              core.setFailed(
                'Для PR необходимо выбрать ровно одну метку: ' +
                'version:patch, version:minor или version:major.'
              );
            }

      - name: Проверить Docker Compose конфигурации
        run: |
          docker compose --env-file environments/dev/.env.example \
            -f environments/dev/docker-compose.yml config -q
          docker compose --env-file environments/test/.env.example \
            -f environments/test/docker-compose.yml config -q

      - name: Собрать проект и выполнить тесты
        run: mvn --batch-mode --no-transfer-progress clean verify
