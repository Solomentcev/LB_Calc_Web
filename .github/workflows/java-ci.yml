name: Java CI

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  push:
    branches:
      - master

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Проверка Java-проекта
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Настроить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Проверить метку версии PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(label => label.name);
            const versionLabels = labels.filter(label =>
              ['version:patch', 'version:minor', 'version:major'].includes(label)
            );

            if (versionLabels.length !== 1) {
              core.setFailed(
                'PR должен иметь ровно одну метку: version:patch, version:minor или version:major.'
              );
            }

      - name: Проверить Docker Compose конфигурации
        run: |
          docker compose --env-file environments/dev/.env.example \
            -f environments/dev/docker-compose.yml config -q
          docker compose --env-file environments/test/.env.example \
            -f environments/test/docker-compose.yml config -q

      - name: Собрать проект и выполнить тесты
        run: mvn --batch-mode --no-transfer-progress clean verify
