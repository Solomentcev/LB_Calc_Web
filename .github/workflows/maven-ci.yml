name: LBC CI

on:
  pull_request:
    branches:
      - master

jobs:
  lbc-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile and run LBC tests
        run: >
          mvn -B -pl lb-calc-web test
          -Dmaven.compiler.testIncludes=**/LBCDomainTest.java,**/LBCImageServiceTest.java
          -Dtest=LBCDomainTest,LBCImageServiceTest
