services:

  jenkins:
    build:
      context: .
      
    container_name: jenkins
    restart: always

    ports:
      - "8080:8080"
      - "50000:50000"
      
    environment:

      CHROME_DRIVER: /usr/local/bin/chromedriver

    volumes:
      - jenkins_home:/var/jenkins_home


volumes:
  jenkins_home:
