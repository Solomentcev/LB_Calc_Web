# ===================================================================
# Параметры валидации и значения по умолчанию
# Все линейные размеры указаны в миллиметрах (мм)
# ===================================================================


# ===================================================================
# РАМЫ
# ===================================================================

size.frame.upper.min=20
size.frame.upper.max=300
size.frame.upper.default=50

size.frame.bottom.min=20
size.frame.bottom.max=300
size.frame.bottom.default=50


# ===================================================================
# ВЫСОТА
# ===================================================================

# Минимальная высота ALS/LB/LC
size.height.min=125
size.height.max=2300
size.height.default=1940

# Минимальная высота отдельной ячейки
size.height.cell.min=85

# Минимальная высота LC
size.height.lc.min=600

# Минимальная высота панели LC
size.height.lc.panel.min=300


# ===================================================================
# ГЛУБИНА
# ===================================================================

size.depth.min=170
size.depth.max=900
size.depth.default=500

size.depth.cell.min=100
size.depth.cell.max=880


# ===================================================================
# ШИРИНА
# ===================================================================

size.width.min=100
size.width.max=1200
size.width.default=500

size.width.cell.min=100


# ===================================================================
# КОЛИЧЕСТВО ЯЧЕЕК
# ===================================================================

size.count.cells.min=1
size.count.cells.max=20
size.count.cells.default=3


# ===================================================================
# ТИПЫ LB
#
# Список типов позволяет добавлять новые типы без изменения Java-кода.
# ===================================================================

lb.types=TYPE1,TYPE2,TYPE3,TYPE4

# Тип LB по умолчанию
lb.type.default=TYPE1


# -------------------------------------------------------------------
# TYPE1
# -------------------------------------------------------------------

lb.type.TYPE1.delta-width=100
lb.type.TYPE1.shelf-thick=5
lb.type.TYPE1.service-zone-width=40


# -------------------------------------------------------------------
# TYPE2
# -------------------------------------------------------------------

lb.type.TYPE2.delta-width=100
lb.type.TYPE2.shelf-thick=20
lb.type.TYPE2.service-zone-width=40


# -------------------------------------------------------------------
# TYPE3
# -------------------------------------------------------------------

lb.type.TYPE3.delta-width=160
lb.type.TYPE3.shelf-thick=20
lb.type.TYPE3.service-zone-width=40


# -------------------------------------------------------------------
# TYPE4
# -------------------------------------------------------------------

lb.type.TYPE4.delta-width=60
lb.type.TYPE4.shelf-thick=5
lb.type.TYPE4.service-zone-width=0


# ===================================================================
# ОГРАНИЧЕНИЯ ПАРАМЕТРОВ ТИПОВ LB
# ===================================================================

size.type.delta-width.min=0
size.type.delta-width.max=500

size.type.shelf-thick.min=0
size.type.shelf-thick.max=100

size.type.service-zone-width.min=0
size.type.service-zone-width.max=300

# ===================================================================
# ДВЕРЬ
# ===================================================================

size.door.thickness.min=5
size.door.thickness.max=50
size.door.thickness.default=20