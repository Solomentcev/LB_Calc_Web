# ===================================================================
# Параметры валидации и значения по умолчанию
# Все линейные размеры указаны в миллиметрах (мм)
# ===================================================================


# ===================================================================
# РАМЫ
# ===================================================================

size.frame.upper.min=20
size.frame.upper.max=300
size.frame.upper.default=50

size.frame.bottom.min=20
size.frame.bottom.max=300
size.frame.bottom.default=50


# ===================================================================
# ВЫСОТА
# ===================================================================

# Минимальная высота ALS/LB/LC
size.height.min=125
size.height.max=2300
size.height.default=1940

# Минимальная высота отдельной ячейки
size.height.cell.min=85

# Минимальная высота LC
size.height.lc.min=600

# Минимальная высота панели LC
size.height.lc.panel.min=300


# ===================================================================
# ГЛУБИНА
# ===================================================================

size.depth.min=170
size.depth.max=900
size.depth.default=500

size.depth.cell.min=100
size.depth.cell.max=880


# ===================================================================
# ШИРИНА
# ===================================================================

size.width.min=100
size.width.max=1200
size.width.default=500

size.width.cell.min=100


# ===================================================================
# КОЛИЧЕСТВО ЯЧЕЕК
# ===================================================================

size.count.cells.min=1
size.count.cells.max=20
size.count.cells.default=3


# ===================================================================
# ДВЕРЬ
# ===================================================================

size.door.thickness.min=5
size.door.thickness.max=50
size.door.thickness.default=20

# ===================================================================
# LC
# ===================================================================

# Физические ограничения геометрии LC
lc.geometry.width.min=200
lc.geometry.display.side-clearance=20
lc.geometry.width.rounding-step=50
lc.geometry.display.center-height=1300
lc.geometry.display.top-clearance=20

# Значения функциональной конфигурации модуля управления
lc.display-purpose.default=INCH_10
lc.payment-purpose.default=NONE
lc.printer-purpose.default=ABSENT
lc.access-purposes.default=RFID

lc.color.body.default=Blue
lc.color.door.default=White

# ============================================================
# ALS
# ============================================================

als.color.body.default=Blue
als.color.door.default=White

# Положение единственного модуля управления.
als.position.control-module.default=LEFT

# ============================================================
# LBC
# ============================================================

# LBC использует storage-тип LB и одновременно содержит control-конфигурацию.
# Минимальная ширина складской ячейки LBC.
lbc.geometry.storage-cell.width.min=200

# Техническая ячейка без дисплея имеет минимальный размер 200x200 мм.
# Для дисплея дополнительно предусматривается зазор по 20 мм с каждой стороны.
lbc.geometry.technical-cell.width.min=200
lbc.geometry.technical-cell.height.min=200
lbc.geometry.equipment.clearance=20
lbc.geometry.display.center-height=1300
lbc.display-purpose.default=INCH_10

lbc.payment-purpose.default=NONE
lbc.printer-purpose.default=ABSENT

lbc.color.body.default=Blue
lbc.color.door.default=White
lbc.direction.default=LEFT

# Пустые значения означают отсутствие дополнительных ограничений.
lbc.access-purposes.default=RFID

# ============================================================
# LB default configuration
# ============================================================

lb.color.body.default=Blue
lb.color.door.default=White
lb.direction.default=LEFT

# Геометрические параметры конструктивных типов LB/LBC.
lb.type.TYPE1.delta-width=100
lb.type.TYPE1.shelf-thickness=5
lb.type.TYPE1.service-zone-width=40

lb.type.TYPE2.delta-width=100
lb.type.TYPE2.shelf-thickness=20
lb.type.TYPE2.service-zone-width=40

lb.type.TYPE3.delta-width=160
lb.type.TYPE3.shelf-thickness=20
lb.type.TYPE3.service-zone-width=40

lb.type.TYPE4.delta-width=60
lb.type.TYPE4.shelf-thickness=5
lb.type.TYPE4.service-zone-width=0

# ============================================================
# PROJECT
# ============================================================

project.company.default=Заказчик
