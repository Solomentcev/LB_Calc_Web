spring.application.name=LB_Calc_Web
server.port=8081

spring.config.import=classpath:size-bounds.properties


# ============================================================
# Database
# ============================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================
# JPA / Hibernate
# ============================================================

# Hibernate только проверяет схему.
# Созданием и изменением таблиц занимается Flyway.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.type.descriptor.sql=true


# ============================================================
# Flyway
# ============================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true


# ============================================================
# Logging
# ============================================================

logging.level.org.hibernate.stat=trace
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss
logging.level.com.lb_calc_web=TRACE


# ============================================================
# JWT
# ============================================================

jwt.secret.access=${JWT_SECRET_ACCESS}
jwt.secret.refresh=${JWT_SECRET_REFRESH}

jwt.expiration.access=${JWT_EXPIRATION_ACCESS:36000000}
jwt.expiration.refresh=${JWT_EXPIRATION_REFRESH:252000000}


# ============================================================
# Kafka
# ============================================================

app.kafka.topic.user-events=${KAFKA_TOPIC_USER_EVENTS}

spring.kafka.producer.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.producer.properties.spring.json.add.type.headers=false