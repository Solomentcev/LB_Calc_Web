spring.application.name=LB_Calc_Web

# Значение по умолчанию для названия компании в новом проекте.
project.company.default=Заказчик
server.port=8081
spring.config.import=classpath:size-bounds.properties

# Подключение к MySQL задаётся окружением для DEV и TEST.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate только проверяет схему; миграциями управляет Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# Формат логов: время, уровень, поток и источник сообщения.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n

# Бизнес-код приложения.
logging.level.root=INFO
logging.level.com.lb_calc_web=${LOGGING_LEVEL_COM_LB_CALC_WEB:DEBUG}

# Диагностика HTTP, транзакций, SQL и обмена сообщениями.
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.transaction=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka=INFO

jwt.secret.access=${JWT_SECRET_ACCESS}
jwt.secret.refresh=${JWT_SECRET_REFRESH}
jwt.expiration.access=${JWT_EXPIRATION_ACCESS:36000000}
jwt.expiration.refresh=${JWT_EXPIRATION_REFRESH:252000000}

# Общий адрес Kafka задаётся окружением для DEV и TEST.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
app.kafka.topic.user-events=${KAFKA_TOPIC_USER_EVENTS}
