spring.application.name=LB_Calc_Web
server.port=8081
spring.config.import=classpath:size-bounds.properties

# Подключение к MySQL задаётся окружением для DEV и TEST.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Сохраняем режим работы схемы текущей версии master.
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss
logging.level.com.lb_calc_web=${LOGGING_LEVEL_COM_LB_CALC_WEB:INFO}

jwt.secret.access=${JWT_SECRET_ACCESS}
jwt.secret.refresh=${JWT_SECRET_REFRESH}
jwt.expiration.access=${JWT_EXPIRATION_ACCESS:36000000}
jwt.expiration.refresh=${JWT_EXPIRATION_REFRESH:252000000}

# Общие параметры Kafka для producer и consumer.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
app.kafka.topic.user-events.name=${KAFKA_TOPIC_USER_EVENTS}
