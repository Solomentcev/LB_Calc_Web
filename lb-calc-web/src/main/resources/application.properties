spring.application.name=LB_Calc_Web
server.port=8081
spring.config.import=classpath:size-bounds.properties

# MySQL: единый адрес для запуска приложения из IDEA и Docker.
spring.datasource.url=jdbc:mysql://${DOCKER_HOST_ADDRESS}:${MYSQL_PORT}/${MYSQL_DATABASE}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate только проверяет схему; миграциями управляет Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss
logging.level.com.lb_calc_web=${LOGGING_LEVEL_COM_LB_CALC_WEB:INFO}

jwt.secret.access=${JWT_SECRET_ACCESS}
jwt.secret.refresh=${JWT_SECRET_REFRESH}
jwt.expiration.access=${JWT_EXPIRATION_ACCESS:36000000}
jwt.expiration.refresh=${JWT_EXPIRATION_REFRESH:252000000}

# Единый адрес Kafka для IDEA и Docker.
spring.kafka.bootstrap-servers=${DOCKER_HOST_ADDRESS}:${KAFKA_EXTERNAL_PORT}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
app.kafka.topic.user-events=${KAFKA_TOPIC_USER_EVENTS}
