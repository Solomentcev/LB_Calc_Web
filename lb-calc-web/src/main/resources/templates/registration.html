<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Регистрация')}"></head>
<body>
<div th:replace="~{header :: header}"></div>

<div class="container mt-4">
    <h2>Регистрация</h2>

    <div th:if="${errorMessage}!=null" class="text-danger"
         th:text="${errorMessage}">
    </div>
    <form th:action="@{/registration}"
          th:object="${employee}" method="post">
        <div class="form-group">
            <label>First Name</label>
            <input type="text" class="form-control" th:field="*{firstName}" required>
            <span class="text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
        </div>

        <div class="form-group">
            <label>Last Name</label>
            <input type="text" class="form-control" th:field="*{lastName}" required>
            <span class="text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
        </div>

        <div class="form-group" >
            <label>Email</label>
            <input type="email" class="form-control" th:field="*{email}" required>
            <span class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            <span class="text-danger" th:if="${employeeExists}">Пользователь с таким email уже зарегистрирован</span>
        </div>

        <div class="form-group" >
            <label>Password</label>
            <input type="password" class="form-control" th:field="*{password}" required>
            <span class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" class="form-control" th:field="*{confirmPassword}" required>
            <span class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
        </div>
        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
        <a th:href="@{/login}" class="btn btn-secondary">Отмена</a>
    </form>
</div>

<div th:replace="~{footer :: footer}"></div>
</body>
</html>
