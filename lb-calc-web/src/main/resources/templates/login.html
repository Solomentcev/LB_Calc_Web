<!DOCTYPE html>
<html lang="ru">
<head th:replace="~{fragments/common :: head('Вход')}"></head>
<body>
<div th:replace="~{header :: header}"></div>
<div class="container">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div th:if="${error}" class="alert alert-danger">
                <span th:text="${error}"></span>
            </div>

            <div th:if="${successMessage}!=null" class="alert alert-success">
                <span th:text="${successMessage}"></span>
            </div>
            <div th:if="${param.error}">
                <div class="alert alert-danger" th:text="${param.error}">Неверный адрес электронной почты или пароль</div>
            </div>
            <div th:if="${param.logout}">
                <div class="alert alert-success"> Вы вышли из системы.</div>
            </div>

            <div class="card">
                <div class="card-header text-center">
                    <h2 class="text-center">Вход</h2>
                    <a class="text-center" th:href="@{/registration}">Зарегистрироваться</a>
                </div>
                <div class="card-body">
                    <form method="post" th:object="${loginRequest}" th:action="@{/login}" class="form-horizontal">
                        <div class="form-group mb-3">
                            <label class="control-label" for="email">Электронная почта</label>
                            <input
                                    type="email"
                                    id="email"
                                    th:field="*{email}"
                                    class="form-control"
                                    placeholder="Введите адрес электронной почты"
                            />
                            <div th:if="${#fields.hasErrors('email')}" class="text-danger">
                                <p th:each="e : ${#fields.errors('email')}" th:text="${e}"></p>
                            </div>
                        </div>

                        <div class="form-group mb-3">
                            <label class="control-label" for="password">Пароль</label>
                            <input
                                    type="password"
                                    id="password"
                                    th:field="*{password}"
                                    class="form-control"
                                    placeholder="Введите пароль"
                            />
                            <div th:if="${#fields.hasErrors('password')}" class="text-danger">
                                <p th:each="e : ${#fields.errors('password')}" th:text="${e}"></p>
                            </div>
                        </div>
                        <div class="form-group mb-3">
                            <button type="submit" class="btn btn-primary">Подтвердить</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
