<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">LB_Calc_Web</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkJwJ8ERdknLPMO"
          crossorigin="anonymous">
    <style>
        html,
        body {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            background-color: #f8f9fa;
            color: #212529;
        }

        body > main,
        body > .container,
        body > .container-fluid {
            width: 100%;
            min-width: 0;
            padding-top: 1.5rem;
            padding-bottom: 1.5rem;
        }

        h1,
        h2 {
            margin-bottom: 1.25rem;
        }

        table {
            background-color: #fff;
        }

        table[border] {
            border: 1px solid #dee2e6;
        }

        table[border] th,
        table[border] td {
            border: 1px solid #dee2e6;
            padding: 0.75rem;
            vertical-align: middle;
        }

        input:not([class~="form-control"]):not([type="hidden"]):not([type="checkbox"]):not([type="radio"]):not([type="submit"]),
        select:not([class~="form-control"]),
        textarea:not([class~="form-control"]) {
            display: inline-block;
            max-width: 100%;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            line-height: 1.5;
            color: #495057;
            background-color: #fff;
            border: 1px solid #ced4da;
            border-radius: 0.25rem;
        }

        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
