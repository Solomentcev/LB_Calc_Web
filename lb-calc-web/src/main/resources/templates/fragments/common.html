<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">LB_Calc_Web</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkJwJ8ERdknLPMO"
          crossorigin="anonymous">
    <style>
        html,
        body {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f8f9fa;
        }

        body > header {
            flex: 0 0 auto;
        }

        body > .container,
        body > .container-fluid {
            width: 100%;
            flex: 1 0 auto;
            padding-top: 1.5rem;
            padding-bottom: 1.5rem;
        }

        body > footer {
            flex: 0 0 auto;
            margin-top: auto;
        }

        .table-responsive-md {
            display: block;
            overflow-x: auto;
        }
    </style>
</head>
