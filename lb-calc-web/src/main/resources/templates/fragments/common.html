<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">LB_Calc_Web</title>
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkJwJ8ERdknLPMO"
          crossorigin="anonymous">
    <style>
        html,
        body {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            background-color: #f8f9fa;
            color: #212529;
        }

        .container,
        .container-fluid {
            width: 100%;
            max-width: 1440px;
            min-width: 0;
            margin-right: auto;
            margin-left: auto;
            padding: 1.5rem 1.5rem;
        }

        main {
            min-width: 0;
        }

        h1 {
            margin-bottom: 1.5rem;
            font-size: 2rem;
            font-weight: 600;
        }

        h2 {
            margin-bottom: 1.25rem;
            font-size: 1.5rem;
            font-weight: 600;
        }

        h3 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .btn,
        .btn-sm {
            padding: 0.375rem 0.75rem;
            font-size: 0.875rem;
            line-height: 1.5;
        }

        .btn + .btn,
        .btn + a,
        a.btn + .btn,
        a.btn + a.btn {
            margin-left: 0.25rem;
        }

        .card {
            border-color: #dee2e6;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .card-header {
            background-color: #f1f3f5;
        }

        .table {
            margin-bottom: 1.5rem;
            background-color: #fff;
        }

        .table thead th {
            background-color: #f1f3f5;
            border-bottom-width: 1px;
            vertical-align: middle;
            white-space: nowrap;
        }

        .table td,
        .table th {
            vertical-align: middle;
        }

        .table[border] {
            border: 1px solid #dee2e6;
        }

        .table[border] th,
        .table[border] td {
            border: 1px solid #dee2e6;
            padding: 0.75rem;
        }

        .form-group label,
        .card-body > .row label {
            font-weight: 500;
        }

        .form-control {
            min-width: 0;
        }

        input:not([class~="form-control"]):not([type="hidden"]):not([type="checkbox"]):not([type="radio"]):not([type="submit"]),
        select:not([class~="form-control"]),
        textarea:not([class~="form-control"]) {
            display: inline-block;
            max-width: 100%;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            line-height: 1.5;
            color: #495057;
            background-color: #fff;
            border: 1px solid #ced4da;
            border-radius: 0.25rem;
        }

        .alert {
            margin-bottom: 1.25rem;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        @media (max-width: 575.98px) {
            .container,
            .container-fluid {
                padding-right: 1rem;
                padding-left: 1rem;
            }

            h1 {
                font-size: 1.65rem;
            }
        }
    </style>
</head>
