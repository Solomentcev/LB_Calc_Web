<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="functionalConfiguration" class="module-section">
    <div class="module-section__header">
        <h2>Функциональные назначения</h2>
        <p>Логические возможности модуля. Они не определяют автоматически перечень установленного оборудования.</p>
    </div>
    <div class="module-section__body">
        <div class="form-row">
            <div class="col-md-6 module-field">
                <label for="module-display">Дисплей</label>
                <select id="module-display" class="form-control" th:field="*{functionalConfiguration.display}">
                    <option th:each="purpose : \${displayPurposes}" th:value="\${purpose}" th:text="\${purpose}"></option>
                </select>
            </div>
            <div class="col-md-6 module-field">
                <label for="module-payment">Оплата</label>
                <select id="module-payment" class="form-control" th:field="*{functionalConfiguration.payment}">
                    <option th:each="purpose : \${paymentPurposes}" th:value="\${purpose}" th:text="\${purpose}"></option>
                </select>
            </div>
            <div class="col-md-6 module-field">
                <label for="module-access">Способы доступа</label>
                <input type="hidden" name="_functionalConfiguration.access" value="on">
                <select id="module-access" multiple size="4" class="form-control"
                        th:field="*{functionalConfiguration.access}">
                    <option th:each="purpose : \${accessPurposes}" th:value="\${purpose}" th:text="\${purpose}"></option>
                </select>
                <small class="module-field-hint">Можно выбрать несколько способов доступа.</small>
            </div>
            <div class="col-md-6 module-field">
                <label for="module-printer">Печать</label>
                <select id="module-printer" class="form-control" th:field="*{functionalConfiguration.printer}">
                    <option th:each="purpose : \${printerPurposes}" th:value="\${purpose}" th:text="\${purpose}"></option>
                </select>
            </div>
        </div>
    </div>
</section>

<section th:fragment="equipmentSelections" class="module-section">
    <div class="module-section__header">
        <h2>Физическое оборудование</h2>
        <p>Выберите фактически устанавливаемые модели и укажите количество каждой модели.</p>
    </div>
    <div class="module-section__body">
        <input type="hidden" name="equipmentSelectionsProvided" value="true">
        <div id="equipment-selection-list">
            <div class="module-equipment-row equipment-selection-row"
                 th:each="selection, selectionStat : *{equipmentSelections}">
                <div class="module-field">
                    <label th:for="|equipment-\${selectionStat.index}|">Модель оборудования</label>
                    <select class="form-control" th:id="|equipment-\${selectionStat.index}|"
                            th:name="|equipmentSelections[\${selectionStat.index}].equipmentId|">
                        <option value="">Выберите модель</option>
                        <option th:each="item : \${equipmentList}" th:value="\${item.id}"
                                th:selected="\${item.id == selection.equipmentId}"
                                th:text="|[\${item.functionalType}] \${item.name} — \${item.purpose} (\${item.width} × \${item.height} × \${item.depth} мм)|"></option>
                    </select>
                </div>
                <div class="module-field">
                    <label th:for="|quantity-\${selectionStat.index}|">Количество</label>
                    <input class="form-control" type="number" min="1"
                           th:id="|quantity-\${selectionStat.index}|"
                           th:name="|equipmentSelections[\${selectionStat.index}].quantity|"
                           th:value="\${selection.quantity}">
                </div>
                <button type="button" class="btn btn-outline-danger module-equipment-remove remove-equipment">
                    Удалить
                </button>
            </div>
        </div>
        <button type="button" id="add-equipment" class="btn btn-outline-primary">
            Добавить оборудование
        </button>
        <template id="equipment-selection-row-template">
            <div class="module-equipment-row equipment-selection-row">
                <div class="module-field">
                    <label>Модель оборудования</label>
                    <select class="form-control" name="equipmentSelections[__INDEX__].equipmentId">
                        <option value="">Выберите модель</option>
                        <option th:each="item : \${equipmentList}" th:value="\${item.id}"
                                th:text="|[\${item.functionalType}] \${item.name} — \${item.purpose} (\${item.width} × \${item.height} × \${item.depth} мм)|"></option>
                    </select>
                </div>
                <div class="module-field">
                    <label>Количество</label>
                    <input class="form-control" type="number" min="1" value="1"
                           name="equipmentSelections[__INDEX__].quantity">
                </div>
                <button type="button" class="btn btn-outline-danger module-equipment-remove remove-equipment">
                    Удалить
                </button>
            </div>
        </template>
    </div>
</section>
</body>
</html>
