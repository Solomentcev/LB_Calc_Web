<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Модуль управления в составе АКХ')}"></head>
<body>
<div th:replace="~{header :: header}"></div>
<div class="container">
    <br/>
    <form action="#" th:action="@{/alss/{alsId}/lcs/{lcId}/save (alsId=${als.getId()},lcId=${als.getLC().getId})}"
          th:object="${lc}" method="post">
        <p  th:each="erorr, item: ${errors}" class="alert alert-danger"
            th:text="${item.current}"></p>
        <button type="submit" class="btn btn-primary btn-sm mb-3">Сохранить Модуль управления</button>
        <a th:href="@{/alss/{alsId} (alsId=${als.getId()})}"
           class="btn btn-primary btn-sm mb-3"
           th:text="'Back to #'+${als.id}+'-'+${als.name}">Back to ALS</a>
        <br/>
        <h4 th:text="*{description}">Модуль управления</h4>
        <label hidden="hidden">
            <input size="180"  type="text" th:field="*{description}" readonly="readonly">
        </label>
        <table border="1" class="table table-striped table-responsive-md">
            <tr>
                <th>ID</th>
                <td>
                    <label>
                        <input type="text" size="3" th:field="*{id}" readonly="readonly">
                    </label>
                </td>
                <td rowspan="13">
                    <div class="container-fluid">
                        <img class="img-thumbnail"
                             th:src="'data:image/png;base64,'+${lc.getStringLCImage()}"
                             alt="LC Image">
                    </div>
                </td>
            </tr>
            <tr>
                <th>Name</th>
                <td>
                    <label>
                        <input  size="30" type="text" height="" th:field="*{name}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>Height</th>
                <td>
                    <label>
                        <input type="text" size="4" th:field="*{height}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>Width</th>
                <td>
                    <label>
                        <input type="text" size="4" th:field="*{width}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>Depth</th>
                <td>
                    <label>
                        <input type="text" size="4" th:field="*{depth}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>UpperFrame</th>
                <td>
                    <label>
                        <input type="text" size="4" th:field="*{upperFrame}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>BottomFrame</th>
                <td>
                    <label>
                        <input type="text" size="4" th:field="*{bottomFrame}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>ColorBody</th>
                <td>
                    <label>
                        <input type="text" th:field="*{colorBody}"
                               readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>Display</th>
                <td>
                    <label>
                        <select th:field="*{display}">
                            <option th:each="display:${displayList}" th:value="${display}" th:text="${display}">
                            </option>
                        </select>
                    </label>
                </td>
            </tr>
            <tr>
                <th>Payment</th>
                <td>
                    <label>
                        <select th:field="*{payment}">
                            <option th:each="payment:${paymentList}" th:value="${payment}" th:text="${payment}">
                            </option>
                        </select>
                    </label>
                </td>
            </tr>
            <tr>
                <th>Способы доступа</th>
                <td>
                    <label>
                        <select multiple class="form-control" th:field="*{accessMethods}">
                            <option th:each="method : ${accessMethodList}"
                                    th:value="${method}" th:text="${method}">
                            </option>
                        </select>
                    </label>
                </td>
            </tr>
        </table>
</form>
</div>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
