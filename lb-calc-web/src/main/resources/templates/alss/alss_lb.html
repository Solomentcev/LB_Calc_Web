<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Модуль хранения в составе АКХ')}"></head>
<body>
<div th:replace="~{header :: header}"></div>
<div class="container">
    <form action="#" th:action="@{/alss/{alsId}/lbs/{lbId}/save (alsId=${als.getId()},lbId=${lb.getId})}"
          th:object="${lb}" method="post">
        <p  th:each="erorr, item: ${errors}" class="alert alert-danger"
            th:text="${item.current}"></p>
        <button type="submit" class="btn btn-primary btn-sm mb-3">Сохранить Модуль хранения</button>
        <a th:href="@{/alss/{alsId} (alsId=${als.getId()})}"
           class="btn btn-primary btn-sm mb-3"
           th:text="'К АКХ №' + ${als.id} + ' — ' + ${als.name}">Вернуться к АКХ</a>
        <br/>
        <h4 th:text="*{description}">Модуль хранения</h4>
        <label hidden="hidden">
            <input size="130"  type="text" th:field="*{description}" readonly="readonly">
        </label>

        <div class="table-responsive">
        <table class="table table-striped">
            <tr>
                <th >ID</th>
                <td>
                    <label>
                        <input type="number" size="3" th:field="*{id}" readonly="readonly">
                    </label>
                </td>
                <td rowspan="16">
                    <div>
                        <img class="img-thumbnail" th:src="'data:image/png;base64,'+${lb.getStringLBImage()}" alt="LB Image">
                    </div>
                </td>
            </tr>
            <tr>
                <th>Название</th>
                <td>
                    <label>
                        <input  size="30" type="text" height="" th:field="*{name}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>Тип</th>
                <td>
                    <label>
                        <select th:field="*{type}">
                            <option th:each="type:${typeLbList}"
                                    th:value="${type}"
                                    th:text="${type}">
                            </option>
                        </select>
                    </label>
                </td>
            </tr>
            <tr>
                <th>Толщина полки</th>
                <td>
                    <label>
                        <input type="number" size="3" th:field="*{shelfThick}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>Количество ячеек</th>
                <td>
                    <label>
                        <input type="number" size="3" th:field="*{countCells}">
                    </label>
                </td>
            </tr>
            <tr>
                <th>Высота</th>
                <td>
                    <label>
                        <input type="number" size="4" th:field="*{height}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>Ширина</th>
                <td>
                    <label>
                        <input type="number" size="4" th:field="*{width}">
                    </label>
                </td>
            </tr>
            <tr>
                <th>Глубина</th>
                <td>
                    <label>
                        <input type="number" size="4" th:field="*{depth}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>Верхняя рама</th>
                <td>
                    <label>
                        <input type="number" size="4" th:field="*{upperFrame}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>Нижняя рама</th>
                <td>
                    <label>
                        <input type="number" size="4" th:field="*{bottomFrame}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>Высота ячейки</th>
                <td>
                    <label>
                        <input  type="number" size="4" th:field="*{heightCell}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>Ширина ячейки</th>
                <td>
                    <label>
                        <input type="number" size="4" th:field="*{widthCell}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>Глубина ячейки</th>
                <td>
                    <label>
                        <input type="number" size="4" th:field="*{depthCell}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>Направление открывания двери</th>
                <td>
                    <label>
                        <input type="text" th:field="*{directionDoorOpening}"
                               readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>Цвет корпуса</th>
                <td>
                    <label>
                        <input type="text" th:field="*{colorBody}"
                               readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>Цвет дверей</th>
                <td>
                    <label>
                        <input type="text" th:field="*{colorDoor}"
                               readonly="readonly">
                    </label>
                </td>
            </tr>
        </table>
        </div>
    </form>
</div>

<div th:replace="~{footer :: footer}"></div>
</body>
</html>
