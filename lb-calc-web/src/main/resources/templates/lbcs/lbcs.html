
<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Каталог LBC')}"></head>
<body>
<div th:replace="~{header :: header}"></div>
<div class="container">
    <h1 class="page-title">Комбинированные модули LBC</h1>
    <div class="page-actions">
        <a th:href="@{/lbcs/create}" class="btn btn-primary btn-sm">Создать LBC</a>
        <a th:href="@{/}" class="btn btn-secondary btn-sm">Назад</a>
    </div>
    <div class="table-responsive">
    <table class="table table-striped table-hover js-data-table">
        <thead><tr>
            <th>ID</th><th>Название</th><th>Тип</th><th>Ячейки</th>
            <th>Размеры В×Ш×Г</th><th>Конфигурация</th><th>Действие</th>
        </tr></thead>
        <tbody>
        <tr th:each="lbc : ${lbcs}">
            <td th:text="${lbc.id}">ID</td>
            <td th:text="${lbc.name}">Name</td>
            <td th:text="${lbc.type}">Type</td>
            <td th:text="${lbc.countCells}">Cells</td>
            <td th:text="${lbc.height + ' × ' + lbc.width + ' × ' + lbc.depth}">Size</td>
            <td th:text="${lbc.description}">Конфигурация</td>
            <td><a th:href="@{/lbcs/{id}(id=${lbc.id})}" class="btn btn-primary btn-sm">Редактировать</a></td>
        </tr>
        </tbody>
    </table>
        </div>
</div>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
