<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Каталог LBC')}"></head>
<body>
<div th:replace="~{header :: header}"></div>
<main class="container">
    <h1 class="page-title">Комбинированные модули LBC</h1>
    <div class="page-actions">
        <a th:href="@{/lbcs/create}" class="btn btn-primary btn-sm">Создать LBC</a>
        <a th:href="@{/}" class="btn btn-secondary btn-sm">Назад</a>
    </div>
    <div class="table-responsive">
        <table class="table table-striped table-hover js-data-table catalog-table">
            <thead><tr>
                <th>ID</th><th>Название</th><th>Тип</th><th>Ячейки</th><th>Высота</th><th>Ширина</th><th>Глубина</th>
                <th>Дисплей</th><th>Доступ</th><th>Оплата</th><th>Печать</th><th>Физическое оборудование</th>
                <th>Цвет корпуса</th><th>Цвет дверей</th><th>Действие</th>
            </tr></thead>
            <tbody>
            <tr th:each="lbc : ${lbcs}">
                <td th:text="${lbc.id}"></td><td th:text="${lbc.name}"></td><td th:text="${lbc.type}"></td>
                <td th:text="${lbc.countCells}"></td><td th:text="${lbc.height}"></td><td th:text="${lbc.width}"></td><td th:text="${lbc.depth}"></td>
                <td th:text="${lbc.functionalConfiguration.display}"></td>
                <td th:text="${lbc.functionalConfiguration.access}"></td>
                <td th:text="${lbc.functionalConfiguration.payment}"></td>
                <td th:text="${lbc.functionalConfiguration.printer}"></td>
                <td><span th:each="selection, stat : ${lbc.equipmentSelections}"
                          th:text="|ID ${selection.equipmentId}: ${selection.quantity} шт.|"></span></td>
                <td th:text="${lbc.colorBody}"></td><td th:text="${lbc.colorDoor}"></td>
                <td><a th:href="@{/lbcs/{id}(id=${lbc.id})}" class="btn btn-primary btn-sm">Изменить</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
