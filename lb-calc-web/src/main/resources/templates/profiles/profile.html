<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Профиль сотрудника')}"></head>
<body>
<div th:replace="~{header :: header}"></div>

<main class="container">
    <h1 class="page-title">Профиль сотрудника</h1>

    <section class="card">
        <div class="card-header d-flex flex-wrap align-items-center justify-content-between">
            <h2 class="mb-0"
                th:text="${employee.firstName + ' ' + employee.lastName}">Сотрудник</h2>
            <span class="text-muted small" th:text="${'ID: ' + employee.id}">ID</span>
        </div>
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-4 col-lg-3">Имя</dt>
                <dd class="col-sm-8 col-lg-9" th:text="${employee.firstName}"></dd>

                <dt class="col-sm-4 col-lg-3">Фамилия</dt>
                <dd class="col-sm-8 col-lg-9" th:text="${employee.lastName}"></dd>

                <dt class="col-sm-4 col-lg-3">Электронная почта</dt>
                <dd class="col-sm-8 col-lg-9 text-break" th:text="${employee.email}"></dd>

                <dt class="col-sm-4 col-lg-3">Роль</dt>
                <dd class="col-sm-8 col-lg-9"
                    th:text="${employee.role == T(com.lb_calc_web.domain.attributes.Role).ROLE_ADMIN ? 'Администратор' : 'Менеджер'}"></dd>

                <dt class="col-sm-4 col-lg-3">Дата регистрации</dt>
                <dd class="col-sm-8 col-lg-9"
                    th:text="${#temporals.format(employee.registrationDate, 'dd.MM.yyyy')}"></dd>
            </dl>
        </div>
        <div class="card-footer bg-white">
            <a th:href="@{/profiles}" class="btn btn-outline-secondary btn-sm">К списку профилей</a>
        </div>
    </section>
</main>

<div th:replace="~{footer :: footer}"></div>
</body>
</html>
