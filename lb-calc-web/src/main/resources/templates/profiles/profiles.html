<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Профили сотрудников')}"></head>
<body><div th:replace="~{header :: header}"></div><div class="container">
<h1 class="page-title">Профили сотрудников</h1>
<div th:replace="~{fragments/pagination :: controls('/profiles', ${q}, ${sort}, ${direction}, ${size}, ${sortOptions})}"></div>
<div class="table-responsive"><table class="table table-striped table-hover catalog-table people-table">
<colgroup><col style="width:8%"><col style="width:15%"><col style="width:15%"><col style="width:34%"><col style="width:18%"><col style="width:10%"></colgroup>
<thead><tr><th>ID</th><th>Имя</th><th>Фамилия</th><th>Электронная почта</th><th>Дата регистрации</th><th>Действия</th></tr></thead>
<tbody><tr th:each="employee : ${employees}">
<td th:text="${employee.id}"></td><td th:text="${employee.firstName}"></td><td th:text="${employee.lastName}"></td><td th:text="${employee.email}"></td><td th:text="${employee.registrationDate}"></td>
<td><a th:href="@{'/profiles/' + ${employee.id}}" class="btn btn-sm btn-primary">Просмотр</a></td>
</tr></tbody></table></div>
</div><div th:replace="~{footer :: footer}"></div></body></html>
