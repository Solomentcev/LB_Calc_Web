<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Проекты')}"></head>
<body><div th:replace="~{header :: header}"></div>
<div class="container">
<h1 class="page-title">Проекты</h1>
<div class="page-actions"><a th:href="@{/projects/create}" class="btn btn-primary btn-sm">Создать проект</a><a th:href="@{/}" class="btn btn-secondary btn-sm">Назад</a></div>
<div th:replace="~{fragments/pagination :: controls('/projects', ${q}, ${sort}, ${direction}, ${size}, ${sortOptions})}"></div>
<div class="table-responsive"><table class="table table-striped table-hover catalog-table project-table">
<colgroup><col style="width:4%"><col style="width:13%"><col style="width:13%"><col style="width:20%"><col style="width:12%"><col style="width:10%"><col style="width:12%"><col style="width:9%"><col style="width:7%"></colgroup>
<thead><tr><th>ID</th><th>Название</th><th>Компания</th><th>Описание</th><th>Создал</th><th>Создан</th><th>Изменил</th><th>Изменён</th><th>Действие</th></tr></thead>
<tbody><tr th:each="project : ${projects}">
<td th:text="${project.id}"></td><td th:text="${project.name}"></td><td th:text="${project.company}"></td><td th:text="${project.description}"></td>
<td th:text="${project.createdBy != null ? project.createdBy.firstName + ' ' + project.createdBy.lastName : ''}"></td><td th:text="${project.createdAt}"></td>
<td th:text="${project.updatedBy != null ? project.updatedBy.firstName + ' ' + project.updatedBy.lastName : ''}"></td><td th:text="${project.updatedAt}"></td>
<td><a th:href="@{/projects/{id}(id=${project.id})}" class="btn btn-primary btn-sm">Открыть</a></td></tr></tbody></table></div>
</div><div th:replace="~{footer :: footer}"></div></body></html>
