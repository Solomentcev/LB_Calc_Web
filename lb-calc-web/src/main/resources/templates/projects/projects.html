<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Проекты')}"></head>
<body>
<div th:replace="~{header :: header}"></div>
<div class="container">
    <h1 class="page-title">Проекты</h1>
    <div class="page-actions">
        <a th:href="@{/projects/create}" class="btn btn-primary btn-sm">Создать проект</a>
        <a th:href="@{/}" class="btn btn-secondary btn-sm">Назад</a>
    </div>

    <form id="project-filter-form" th:action="@{/projects}" method="get" class="mb-2">
        <input type="hidden" name="page" value="0">
        <input type="hidden" name="sort" th:value="${sort}">
        <input type="hidden" name="direction" th:value="${direction}">
        <input type="hidden" name="size" th:value="${size}">
        <button type="submit" class="btn btn-outline-primary btn-sm">Применить фильтры</button>
        <a th:href="@{/projects}" class="btn btn-outline-secondary btn-sm">Сбросить</a>
    </form>

    <form id="project-sort-form" th:action="@{/projects}" method="get" class="form-inline mb-3">
        <input type="hidden" name="page" value="0">
        <input type="hidden" name="id" th:value="${filters.id}">
        <input type="hidden" name="name" th:value="${filters.name}">
        <input type="hidden" name="company" th:value="${filters.company}">
        <input type="hidden" name="description" th:value="${filters.description}">
        <input type="hidden" name="createdByFirstName" th:value="${filters.createdByFirstName}">
        <input type="hidden" name="createdByLastName" th:value="${filters.createdByLastName}">
        <input type="hidden" name="createdAtFrom" th:value="${filters.createdAtFrom}">
        <input type="hidden" name="createdAtTo" th:value="${filters.createdAtTo}">
        <input type="hidden" name="updatedByFirstName" th:value="${filters.updatedByFirstName}">
        <input type="hidden" name="updatedByLastName" th:value="${filters.updatedByLastName}">
        <input type="hidden" name="updatedAtFrom" th:value="${filters.updatedAtFrom}">
        <input type="hidden" name="updatedAtTo" th:value="${filters.updatedAtTo}">
        <label class="mr-2" for="project-sort">Сортировка</label>
        <select id="project-sort" class="form-control form-control-sm mr-2" name="sort">
            <option value="id" th:selected="${sort == 'id'}">ID</option>
            <option value="name" th:selected="${sort == 'name'}">Название</option>
            <option value="company" th:selected="${sort == 'company'}">Компания</option>
            <option value="description" th:selected="${sort == 'description'}">Описание</option>
            <option value="createdBy" th:selected="${sort == 'createdBy'}">Создатель</option>
            <option value="createdAt" th:selected="${sort == 'createdAt'}">Дата создания</option>
            <option value="updatedBy" th:selected="${sort == 'updatedBy'}">Последний редактор</option>
            <option value="updatedAt" th:selected="${sort == 'updatedAt'}">Дата изменения</option>
        </select>
        <select class="form-control form-control-sm mr-2" name="direction" aria-label="Направление сортировки">
            <option value="asc" th:selected="${direction == 'asc'}">По возрастанию</option>
            <option value="desc" th:selected="${direction == 'desc'}">По убыванию</option>
        </select>
        <label class="mr-2" for="project-size">Строк</label>
        <select id="project-size" class="form-control form-control-sm mr-2" name="size">
            <option value="10" th:selected="${size == 10}">10</option>
            <option value="20" th:selected="${size == 20}">20</option>
            <option value="50" th:selected="${size == 50}">50</option>
            <option value="100" th:selected="${size == 100}">100</option>
        </select>
        <button type="submit" class="btn btn-outline-primary btn-sm">Применить</button>
    </form>

    <div class="table-responsive">
        <table class="table table-striped table-hover catalog-table project-table">
            <colgroup>
                <col style="width:4%"><col style="width:13%"><col style="width:13%">
                <col style="width:20%"><col style="width:12%"><col style="width:10%">
                <col style="width:12%"><col style="width:9%"><col style="width:7%">
            </colgroup>
            <thead>
            <tr>
                <th>ID</th><th>Название</th><th>Компания</th><th>Описание</th>
                <th>Создатель</th><th>Дата создания</th><th>Последний редактор</th>
                <th>Дата изменения</th><th>Действия</th>
            </tr>
            <tr>
                <th><input form="project-filter-form" class="form-control form-control-sm" type="number" min="1" name="id" th:value="${filters.id}" placeholder="ID"></th>
                <th><input form="project-filter-form" class="form-control form-control-sm" type="text" name="name" th:value="${filters.name}" placeholder="Содержит"></th>
                <th><input form="project-filter-form" class="form-control form-control-sm" type="text" name="company" th:value="${filters.company}" placeholder="Содержит"></th>
                <th><input form="project-filter-form" class="form-control form-control-sm" type="text" name="description" th:value="${filters.description}" placeholder="Содержит"></th>
                <th>
                    <input form="project-filter-form" class="form-control form-control-sm" type="text" name="createdByFirstName" th:value="${filters.createdByFirstName}" placeholder="Имя">
                    <input form="project-filter-form" class="form-control form-control-sm mt-1" type="text" name="createdByLastName" th:value="${filters.createdByLastName}" placeholder="Фамилия">
                </th>
                <th>
                    <input form="project-filter-form" class="form-control form-control-sm" type="date" name="createdAtFrom" th:value="${filters.createdAtFrom}" aria-label="Дата создания от">
                    <input form="project-filter-form" class="form-control form-control-sm mt-1" type="date" name="createdAtTo" th:value="${filters.createdAtTo}" aria-label="Дата создания до">
                </th>
                <th>
                    <input form="project-filter-form" class="form-control form-control-sm" type="text" name="updatedByFirstName" th:value="${filters.updatedByFirstName}" placeholder="Имя">
                    <input form="project-filter-form" class="form-control form-control-sm mt-1" type="text" name="updatedByLastName" th:value="${filters.updatedByLastName}" placeholder="Фамилия">
                </th>
                <th>
                    <input form="project-filter-form" class="form-control form-control-sm" type="date" name="updatedAtFrom" th:value="${filters.updatedAtFrom}" aria-label="Дата изменения от">
                    <input form="project-filter-form" class="form-control form-control-sm mt-1" type="date" name="updatedAtTo" th:value="${filters.updatedAtTo}" aria-label="Дата изменения до">
                </th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="project : ${projects}">
                <td th:text="${project.id}"></td>
                <td th:text="${project.name}"></td>
                <td th:text="${project.company}"></td>
                <td th:text="${project.description}"></td>
                <td th:text="${project.createdBy != null ? project.createdBy.firstName + ' ' + project.createdBy.lastName : ''}"></td>
                <td th:text="${project.createdAt}"></td>
                <td th:text="${project.updatedBy != null ? project.updatedBy.firstName + ' ' + project.updatedBy.lastName : ''}"></td>
                <td th:text="${project.updatedAt}"></td>
                <td><a th:href="@{/projects/{id}(id=${project.id})}" class="btn btn-primary btn-sm">Открыть</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(projects)}"><td colspan="9" class="text-center">Нет проектов, соответствующих фильтрам</td></tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${page.totalPages > 1}" aria-label="Навигация по страницам"
         class="d-flex align-items-center justify-content-between mb-3">
        <span class="text-muted small" th:text="${'Записи ' + (page.number * page.size + 1) + '–' + (page.number * page.size + page.numberOfElements) + ' из ' + page.totalElements}">Записи</span>
        <div>
            <a th:if="${page.hasPrevious()}" class="btn btn-outline-secondary btn-sm"
               th:href="@{/projects(page=${page.number - 1},size=${size},sort=${sort},direction=${direction},id=${filters.id},name=${filters.name},company=${filters.company},description=${filters.description},createdByFirstName=${filters.createdByFirstName},createdByLastName=${filters.createdByLastName},createdAtFrom=${filters.createdAtFrom},createdAtTo=${filters.createdAtTo},updatedByFirstName=${filters.updatedByFirstName},updatedByLastName=${filters.updatedByLastName},updatedAtFrom=${filters.updatedAtFrom},updatedAtTo=${filters.updatedAtTo})}">Назад</a>
            <span class="small mx-2" th:text="${(page.number + 1) + ' / ' + page.totalPages}">1 / 1</span>
            <a th:if="${page.hasNext()}" class="btn btn-outline-secondary btn-sm"
               th:href="@{/projects(page=${page.number + 1},size=${size},sort=${sort},direction=${direction},id=${filters.id},name=${filters.name},company=${filters.company},description=${filters.description},createdByFirstName=${filters.createdByFirstName},createdByLastName=${filters.createdByLastName},createdAtFrom=${filters.createdAtFrom},createdAtTo=${filters.createdAtTo},updatedByFirstName=${filters.updatedByFirstName},updatedByLastName=${filters.updatedByLastName},updatedAtFrom=${filters.updatedAtFrom},updatedAtTo=${filters.updatedAtTo})}">Вперёд</a>
        </div>
    </nav>
</div>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
