<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Проекты</title>

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>

<body>

<div th:replace="~{header :: header}"></div>

<div class="container-fluid">

    <h1>Проекты</h1>

    <a th:href="@{/projects/create}"
       class="btn btn-primary btn-sm mb-3">
        Создать проект
    </a>

    <a th:href="@{/}"
       class="btn btn-primary btn-sm mb-3">
        Назад
    </a>

    <br>

    <table border="1"
           class="table table-striped table-responsive-md">

        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Компания</th>
            <th>Описание</th>
            <th>Создал</th>
            <th>Дата создания</th>
            <th>Изменил</th>
            <th>Дата изменения</th>
            <th>Действие</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="project : ${projects}">

            <td th:text="${project.id}">
                ID
            </td>

            <td th:text="${project.name}">
                Name
            </td>

            <td th:text="${project.company}">
                Company
            </td>

            <td th:text="${project.description}">
                Description
            </td>

            <td th:text="${project.createdBy != null
                           ? project.createdBy.username
                           : ''}">
                CreatedBy
            </td>

            <td th:text="${project.createdAt}">
                CreatedAt
            </td>

            <td th:text="${project.updatedBy != null
                           ? project.updatedBy.username
                           : ''}">
                UpdatedBy
            </td>

            <td th:text="${project.updatedAt}">
                UpdatedAt
            </td>

            <td>
                <a th:href="@{/projects/{id}(id=${project.id})}"
                   class="btn btn-primary btn-sm">
                    Открыть
                </a>
            </td>

        </tr>

        </tbody>

    </table>

</div>

<div th:replace="~{footer :: footer}"></div>

</body>
</html>
