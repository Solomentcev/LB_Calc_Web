<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/common :: head('Проекты')}"></head>

<body>

<div th:replace="~{header :: header}"></div>

<div class="container">

    <h1 class="page-title">Проекты</h1>

    <div class="page-actions">
        <a th:href="@{/projects/create}" class="btn btn-primary btn-sm">Создать проект</a>
        <a th:href="@{/}" class="btn btn-secondary btn-sm">Назад</a>
    </div>

    

    <div class="table-responsive">
    <table class="table table-striped table-hover js-data-table">

        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Компания</th>
            <th>Описание</th>
            <th>Создал</th>
            <th>Дата создания</th>
            <th>Изменил</th>
            <th>Дата изменения</th>
            <th>Действие</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="project : ${projects}">

            <td th:text="${project.id}">
                ID
            </td>

            <td th:text="${project.name}">
                Name
            </td>

            <td th:text="${project.company}">
                Company
            </td>

            <td th:text="${project.description}">
                Description
            </td>

            <td th:text="${project.createdBy != null
                           ? project.createdBy.firstName + ' ' + project.createdBy.lastName
                           : ''}">
                CreatedBy
            </td>

            <td th:text="${project.createdAt}">
                CreatedAt
            </td>

            <td th:text="${project.updatedBy != null
                           ? project.updatedBy.firstName + ' ' + project.updatedBy.lastName
                           : ''}">
                UpdatedBy
            </td>

            <td th:text="${project.updatedAt}">
                UpdatedAt
            </td>

            <td>
                <a th:href="@{/projects/{id}(id=${project.id})}"
                   class="btn btn-primary btn-sm">
                    Открыть
                </a>
            </td>

        </tr>

        </tbody>

    </table>
        </div>

</div>

<div th:replace="~{footer :: footer}"></div>

</body>
</html>
