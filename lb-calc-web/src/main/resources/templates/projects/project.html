<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Проект</title>

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>

<body>

<div th:replace="~{header :: header}"></div>

<div class="container-fluid">

    <br>

    <form th:action="@{/projects/{id}/save(id=${project.id})}"
          th:object="${project}"
          method="post">

        <div class="mb-3">

            <button type="submit"
                    class="btn btn-primary btn-sm">
                Сохранить проект
            </button>

            <a th:href="@{/projects}"
               class="btn btn-secondary btn-sm">
                К списку проектов
            </a>

            <a th:href="@{/projects/{id}/savetoexcel(id=${project.id})}"
               class="btn btn-success btn-sm">
                Excel
            </a>

            <button type="submit"
                    class="btn btn-primary btn-sm"
                    th:formaction="@{/projects/{id}/addALS(id=${project.id})}">
                Добавить ALS
            </button>

        </div>

        <div class="card mb-4">

            <div class="card-header">
                <h2 th:text="${project.name}">
                    Проект
                </h2>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-2">
                        <label>ID</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{id}"
                               readonly aria-label="id">
                    </div>

                    <div class="col-md-4">
                        <label>Название</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{name}" aria-label="name">
                    </div>

                    <div class="col-md-6">
                        <label>Компания</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{company}" aria-label="company">
                    </div>

                </div>

                <div class="row mt-3">

                    <div class="col-md-12">
                        <label>Описание</label>

                        <textarea class="form-control"
                                  rows="3"
                                  th:field="*{description}"
                                  readonly></textarea>
                    </div>

                </div>

                <div class="row mt-3">

                    <div class="col-md-3">
                        <label>Создал</label>
                        <input type="text"
                               class="form-control"
                               th:value="${project.createdBy != null
                                          ? project.createdBy.username
                                          : ''}"
                               readonly aria-label="Поле формы">
                    </div>

                    <div class="col-md-3">
                        <label>Дата создания</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{createdAt}"
                               readonly aria-label="createdAt">
                    </div>

                    <div class="col-md-3">
                        <label>Изменил</label>
                        <input type="text"
                               class="form-control"
                               th:value="${project.updatedBy != null
                                          ? project.updatedBy.username
                                          : ''}"
                               readonly aria-label="Поле формы">
                    </div>

                    <div class="col-md-3">
                        <label>Дата изменения</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{updatedAt}"
                               readonly aria-label="updatedAt">
                    </div>

                </div>

            </div>

        </div>

        <div th:if="${projectErrors != null}"
             class="alert alert-danger">

            <div th:each="errorGroup : ${projectErrors}">
                <div th:each="error : ${errorGroup}"
                     th:text="${error}">
                </div>
            </div>

        </div>

        <div th:each="als, item : ${project.alsList}"
             class="card mb-4">

            <div class="card-header">

                <div class="d-flex justify-content-between">

                    <h4 th:text="'ALS #' + ${item.index + 1}
                                + ' - ' + ${als.name}">
                        ALS
                    </h4>

                    <span class="badge badge-secondary"
                          th:text="'Количество: '
                                  + ${project.quantityALS.get(als)}">
                        Количество
                    </span>

                </div>

            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-2">
                        <label>ID</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{alsList[__${item.index}__].id}"
                               readonly aria-label="alsList[index].id">
                    </div>

                    <div class="col-md-4">
                        <label>Название</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{alsList[__${item.index}__].name}"
                               readonly aria-label="alsList[index].name">
                    </div>

                    <div class="col-md-6">
                        <label>Описание</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{alsList[__${item.index}__].description}"
                               readonly aria-label="alsList[index].description">
                    </div>

                </div>

                <div class="row mt-3">

                    <div class="col-md-2">
                        <label>Положение control-модуля</label>

                        <select class="form-control"
                                th:field="*{alsList[__${item.index}__] .positionControlModule}" aria-label="alsList[index] .positionControlModule">

                            <option th:each="position : ${positionLCList}"
                                    th:value="${position}"
                                    th:text="${position}">
                            </option>

                        </select>
                    </div>

                    <div class="col-md-2">
                        <label>Ячеек</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{alsList[__${item.index}__].countCells}"
                               readonly aria-label="alsList[index].countCells">
                    </div>

                    <div class="col-md-2">
                        <label>Высота</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{alsList[__${item.index}__].height}" aria-label="alsList[index].height">
                    </div>

                    <div class="col-md-2">
                        <label>Ширина</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{alsList[__${item.index}__].width}"
                               readonly aria-label="alsList[index].width">
                    </div>

                    <div class="col-md-2">
                        <label>Глубина</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{alsList[__${item.index}__].depth}" aria-label="alsList[index].depth">
                    </div>

                    <div class="col-md-2">
                        <label>Глубина ячейки</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{alsList[__${item.index}__].depthCell}"
                               readonly aria-label="alsList[index].depthCell">
                    </div>

                </div>

                <div class="row mt-3">

                    <div class="col-md-3">
                        <label>Верхняя рама</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{alsList[__${item.index}__].upperFrame}" aria-label="alsList[index].upperFrame">
                    </div>

                    <div class="col-md-3">
                        <label>Нижняя рама</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{alsList[__${item.index}__].bottomFrame}" aria-label="alsList[index].bottomFrame">
                    </div>

                    <div class="col-md-3">
                        <label>Цвет корпуса</label>

                        <select class="form-control"
                                th:field="*{alsList[__${item.index}__].colorBody}" aria-label="alsList[index].colorBody">

                            <option th:each="color : ${colorsList}"
                                    th:value="${color}"
                                    th:text="${color}">
                            </option>

                        </select>
                    </div>

                    <div class="col-md-3">
                        <label>Цвет дверей</label>

                        <select class="form-control"
                                th:field="*{alsList[__${item.index}__].colorDoor}" aria-label="alsList[index].colorDoor">

                            <option th:each="color : ${colorsList}"
                                    th:value="${color}"
                                    th:text="${color}">
                            </option>

                        </select>
                    </div>

                </div>

                <hr>

                <!-- LC -->

                <h5 th:if="${als.LC != null}"
                    th:text="${als.LC.description}">
                    Модуль управления
                </h5>

                <div th:if="${als.LC != null}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].LC.id}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].LC.name}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].LC.description}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].LC.height}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].LC.width}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].LC.depth}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].LC.upperFrame}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].LC.bottomFrame}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].LC.colorBody}">

                    <div class="row">

                        <div class="col-md-3">
                            <label>Display</label>

                            <select class="form-control"
                                    th:field="*{alsList[__${item.index}__].LC.display}" aria-label="alsList[index].LC.display">

                                <option th:each="display : ${displayList}"
                                        th:value="${display}"
                                        th:text="${display}">
                                </option>

                            </select>
                        </div>

                        <div class="col-md-3">
                            <label>Оплата</label>

                            <select class="form-control"
                                    th:field="*{alsList[__${item.index}__].LC.payment}" aria-label="alsList[index].LC.payment">

                                <option th:each="payment : ${paymentList}"
                                        th:value="${payment}"
                                        th:text="${payment}">
                                </option>

                            </select>
                        </div>

                        <div class="col-md-3">
                            <label>Barcode Reader</label>

                            <select class="form-control"
                                    th:field="*{alsList[__${item.index}__].LC.barReader}" aria-label="alsList[index].LC.barReader">

                                <option th:each="reader : ${barReaderList}"
                                        th:value="${reader}"
                                        th:text="${reader}">
                                </option>

                            </select>
                        </div>

                        <div class="col-md-3">

                            <label class="d-block">
                                Printer
                            </label>

                            <input type="checkbox"
                                   th:field="*{alsList[__${item.index}__].LC.printer}" aria-label="alsList[index].LC.printer">

                        </div>

                    </div>

                    <div class="mt-2">

                        <a th:href="@{/projects/{projectId}/alss/{alsId}/lcs/{lcId}(
                                    projectId=${project.id},
                                    alsId=${als.id},
                                    lcId=${als.LC.id})}"
                           class="btn btn-primary btn-sm">
                            Редактировать LC
                        </a>

                    </div>

                </div>

                <hr>


                <!-- LBC: один физический модуль -->

                <div th:if="${als.LBC != null}"
                     class="border rounded p-3 mb-3">

                    <h5 th:text="${'LBC — ' + als.LBC.name}">
                        LBC
                    </h5>

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.id}">
                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.name}">
                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.description}">
                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.type}">
                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.height}">
                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.width}">
                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.depth}">
                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.upperFrame}">
                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.bottomFrame}">
                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.shelfThick}">
                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.deltaWidth}">
                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.serviceZoneWidth}">
                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.doorThickness}">
                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.countCells}">
                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.heightCell}">
                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.widthCell}">
                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.depthCell}">
                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.directionDoorOpening}">
                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.colorBody}">
                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.colorDoor}">
                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.display}">
                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.barReader}">
                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.payment}">
                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.printer}">
                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbc.rfidReader}">

                    <input type="hidden"
                           th:each="method, methodStat : ${als.LBC.accessMethods}"
                           th:name="|alsList[${item.index}].lbc.accessMethods[${methodStat.index}]|"
                           th:value="${method}">
                    <input type="hidden"
                           th:each="option, optionStat : ${als.LBC.printOptions}"
                           th:name="|alsList[${item.index}].lbc.printOptions[${optionStat.index}]|"
                           th:value="${option}">

                    <div class="row">
                        <div class="col-md-2">
                            <strong>ID:</strong>
                            <span th:text="${als.LBC.id}"></span>
                        </div>
                        <div class="col-md-2">
                            <strong>Тип:</strong>
                            <span th:text="${als.LBC.type}"></span>
                        </div>
                        <div class="col-md-2">
                            <strong>Ячеек:</strong>
                            <span th:text="${als.LBC.countCells}"></span>
                        </div>
                        <div class="col-md-3">
                            <strong>Display:</strong>
                            <span th:text="${als.LBC.display}"></span>
                        </div>
                        <div class="col-md-3">
                            <strong>Payment:</strong>
                            <span th:text="${als.LBC.payment}"></span>
                        </div>
                    </div>

                    <div class="mt-2">
                        <a th:href="@{/projects/{projectId}/alss/{alsId}/lbcs/{lbcId}(
                                    projectId=${project.id},
                                    alsId=${als.id},
                                    lbcId=${als.LBC.id})}"
                           class="btn btn-primary btn-sm">
                            Редактировать LBC
                        </a>
                        <button type="submit"
                                class="btn btn-warning btn-sm"
                                th:formaction="@{/projects/{projectId}/alss/{alsId}/replaceLBC(
                                    projectId=${project.id},
                                    alsId=${als.id})}">
                            Пересоздать LBC
                        </button>
                    </div>
                </div>

                <!-- LB -->

                <h5>
                    Модули хранения
                </h5>

                <div th:each="lb, lbItem : ${als.lbList}"
                     class="border rounded p-3 mb-3">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].id}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].name}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].description}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].height}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].depth}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].upperFrame}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].bottomFrame}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].heightCell}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].widthCell}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].depthCell}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].directionDoorOpening}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].colorBody}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].colorDoor}">

                    <div class="row">

                        <div class="col-md-3">
                            <label>LB</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${lb.name}"
                                   readonly aria-label="Поле формы">
                        </div>

                        <div class="col-md-3">
                            <label>Тип</label>

                            <select class="form-control"
                                    th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].type}" aria-label="alsList[index].lbList[__${lbItem.index}__].type">

                                <option th:each="type : ${typeList}"
                                        th:value="${type}"
                                        th:text="${type}">
                                </option>

                            </select>
                        </div>

                        <div class="col-md-3">
                            <label>Количество ячеек</label>

                            <input type="number"
                                   class="form-control"
                                   th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].countCells}" aria-label="alsList[index].lbList[__${lbItem.index}__].countCells">
                        </div>

                        <div class="col-md-3">
                            <label>Ширина</label>

                            <input type="number"
                                   class="form-control"
                                   th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].width}" aria-label="alsList[index].lbList[__${lbItem.index}__].width">
                        </div>

                    </div>

                    <div class="mt-2">

                        <a th:href="@{/projects/{projectId}/alss/{alsId}/lbs/{lbId}(
                                    projectId=${project.id},
                                    alsId=${als.id},
                                    lbId=${lb.id})}"
                           class="btn btn-primary btn-sm">
                            Редактировать
                        </a>

                    </div>

                </div>

                <button type="submit"
                        class="btn btn-primary btn-sm"
                        th:formaction="@{/projects/{projectId}/alss/{alsId}/addLB(
                                    projectId=${project.id},
                                    alsId=${als.id})}">
                    Добавить LB
                </button>

                <button type="submit"
                        class="btn btn-info btn-sm">
                    Сохранить изменения
                </button>

                <a th:href="@{/projects/{projectId}/alss/{alsId}(
                            projectId=${project.id},
                            alsId=${als.id})}"
                   class="btn btn-secondary btn-sm">
                    Открыть ALS
                </a>

                <button type="submit"
                        class="btn btn-danger btn-sm"
                        th:formaction="@{/projects/{projectId}/alss/{alsId}/delete(
                                    projectId=${project.id},
                                    alsId=${als.id})}">
                    Удалить ALS
                </button>

            </div>

        </div>

    </form>

</div>

<div th:replace="~{footer :: footer}"></div>

</body>
</html>
