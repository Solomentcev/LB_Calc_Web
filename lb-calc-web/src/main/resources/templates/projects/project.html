<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Проект</title>

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>

<body>

<div th:replace="~{header :: header}"></div>

<div class="container-fluid">

    <br>

    <form th:action="@{/projects/{id}/save(id=${project.id})}"
          th:object="${project}"
          method="post">

        <div class="mb-3">

            <button type="submit"
                    class="btn btn-primary btn-sm">
                Сохранить проект
            </button>

            <a th:href="@{/projects}"
               class="btn btn-secondary btn-sm">
                К списку проектов
            </a>

            <a th:href="@{/projects/{id}/savetoexcel(id=${project.id})}"
               class="btn btn-success btn-sm">
                Excel
            </a>

            <button type="submit"
                    class="btn btn-primary btn-sm"
                    th:formaction="@{/projects/{id}/addALS(id=${project.id})}">
                Добавить ALS
            </button>

        </div>

        <div class="card mb-4">

            <div class="card-header">
                <h2 th:text="${project.name}">
                    Проект
                </h2>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-2">
                        <label>ID</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{id}"
                               readonly>
                    </div>

                    <div class="col-md-4">
                        <label>Название</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{name}">
                    </div>

                    <div class="col-md-6">
                        <label>Компания</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{company}">
                    </div>

                </div>

                <div class="row mt-3">

                    <div class="col-md-12">
                        <label>Описание</label>

                        <textarea class="form-control"
                                  rows="3"
                                  th:field="*{description}"
                                  readonly></textarea>
                    </div>

                </div>

                <div class="row mt-3">

                    <div class="col-md-3">
                        <label>Создал</label>
                        <input type="text"
                               class="form-control"
                               th:value="${project.createdBy != null
                                          ? project.createdBy.username
                                          : ''}"
                               readonly>
                    </div>

                    <div class="col-md-3">
                        <label>Дата создания</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{createdAt}"
                               readonly>
                    </div>

                    <div class="col-md-3">
                        <label>Изменил</label>
                        <input type="text"
                               class="form-control"
                               th:value="${project.updatedBy != null
                                          ? project.updatedBy.username
                                          : ''}"
                               readonly>
                    </div>

                    <div class="col-md-3">
                        <label>Дата изменения</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{updatedAt}"
                               readonly>
                    </div>

                </div>

            </div>

        </div>

        <div th:if="${projectErrors != null}"
             class="alert alert-danger">

            <div th:each="errorGroup : ${projectErrors}">
                <div th:each="error : ${errorGroup}"
                     th:text="${error}">
                </div>
            </div>

        </div>

        <div th:each="als, item : ${project.alsList}"
             class="card mb-4">

            <div class="card-header">

                <div class="d-flex justify-content-between">

                    <h4 th:text="'ALS #' + ${item.index + 1}
                                + ' - ' + ${als.name}">
                        ALS
                    </h4>

                    <span class="badge badge-secondary"
                          th:text="'Количество: '
                                  + ${project.quantityALS.get(als)}">
                        Количество
                    </span>

                </div>

            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-2">
                        <label>ID</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{alsList[__${item.index}__].id}"
                               readonly>
                    </div>

                    <div class="col-md-4">
                        <label>Название</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{alsList[__${item.index}__].name}"
                               readonly>
                    </div>

                    <div class="col-md-6">
                        <label>Описание</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{alsList[__${item.index}__].description}"
                               readonly>
                    </div>

                </div>

                <div class="row mt-3">

                    <div class="col-md-2">
                        <label>Положение LC</label>

                        <select class="form-control"
                                th:field="*{alsList[__${item.index}__].positionLC}">

                            <option th:each="position : ${positionLCList}"
                                    th:value="${position}"
                                    th:text="${position}">
                            </option>

                        </select>
                    </div>

                    <div class="col-md-2">
                        <label>Ячеек</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{alsList[__${item.index}__].countCells}"
                               readonly>
                    </div>

                    <div class="col-md-2">
                        <label>Высота</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{alsList[__${item.index}__].height}">
                    </div>

                    <div class="col-md-2">
                        <label>Ширина</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{alsList[__${item.index}__].width}"
                               readonly>
                    </div>

                    <div class="col-md-2">
                        <label>Глубина</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{alsList[__${item.index}__].depth}">
                    </div>

                    <div class="col-md-2">
                        <label>Глубина ячейки</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{alsList[__${item.index}__].depthCell}"
                               readonly>
                    </div>

                </div>

                <div class="row mt-3">

                    <div class="col-md-3">
                        <label>Верхняя рама</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{alsList[__${item.index}__].upperFrame}">
                    </div>

                    <div class="col-md-3">
                        <label>Нижняя рама</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{alsList[__${item.index}__].bottomFrame}">
                    </div>

                    <div class="col-md-3">
                        <label>Цвет корпуса</label>

                        <select class="form-control"
                                th:field="*{alsList[__${item.index}__].colorBody}">

                            <option th:each="color : ${colorsList}"
                                    th:value="${color}"
                                    th:text="${color}">
                            </option>

                        </select>
                    </div>

                    <div class="col-md-3">
                        <label>Цвет дверей</label>

                        <select class="form-control"
                                th:field="*{alsList[__${item.index}__].colorDoor}">

                            <option th:each="color : ${colorsList}"
                                    th:value="${color}"
                                    th:text="${color}">
                            </option>

                        </select>
                    </div>

                </div>

                <hr>

                <!-- LC -->

                <h5 th:if="${als.LC != null}"
                    th:text="${als.LC.description}">
                    Модуль управления
                </h5>

                <div th:if="${als.LC != null}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].LC.id}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].LC.name}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].LC.description}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].LC.height}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].LC.width}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].LC.depth}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].LC.upperFrame}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].LC.bottomFrame}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].LC.colorBody}">

                    <div class="row">

                        <div class="col-md-3">
                            <label>Display</label>

                            <select class="form-control"
                                    th:field="*{alsList[__${item.index}__].LC.display}">

                                <option th:each="display : ${displayList}"
                                        th:value="${display}"
                                        th:text="${display}">
                                </option>

                            </select>
                        </div>

                        <div class="col-md-3">
                            <label>Оплата</label>

                            <select class="form-control"
                                    th:field="*{alsList[__${item.index}__].LC.payment}">

                                <option th:each="payment : ${paymentList}"
                                        th:value="${payment}"
                                        th:text="${payment}">
                                </option>

                            </select>
                        </div>

                        <div class="col-md-3">
                            <label>Barcode Reader</label>

                            <select class="form-control"
                                    th:field="*{alsList[__${item.index}__].LC.barReader}">

                                <option th:each="reader : ${barReaderList}"
                                        th:value="${reader}"
                                        th:text="${reader}">
                                </option>

                            </select>
                        </div>

                        <div class="col-md-3">

                            <label class="d-block">
                                Printer
                            </label>

                            <input type="checkbox"
                                   th:field="*{alsList[__${item.index}__].LC.printer}">

                        </div>

                    </div>

                    <div class="mt-2">

                        <a th:href="@{/projects/{projectId}/alss/{alsId}/lcs/{lcId}(
                                    projectId=${project.id},
                                    alsId=${als.id},
                                    lcId=${als.LC.id})}"
                           class="btn btn-primary btn-sm">
                            Редактировать LC
                        </a>

                    </div>

                </div>

                <hr>

                <!-- LB -->

                <h5>
                    Модули хранения
                </h5>

                <div th:each="lb, lbItem : ${als.lbList}"
                     class="border rounded p-3 mb-3">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].id}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].name}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].description}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].height}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].depth}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].upperFrame}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].bottomFrame}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].heightCell}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].widthCell}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].depthCell}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].directionDoorOpening}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].colorBody}">

                    <input type="hidden"
                           th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].colorDoor}">

                    <div class="row">

                        <div class="col-md-3">
                            <label>LB</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${lb.name}"
                                   readonly>
                        </div>

                        <div class="col-md-3">
                            <label>Тип</label>

                            <select class="form-control"
                                    th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].type}">

                                <option th:each="type : ${typeList}"
                                        th:value="${type}"
                                        th:text="${type}">
                                </option>

                            </select>
                        </div>

                        <div class="col-md-3">
                            <label>Количество ячеек</label>

                            <input type="number"
                                   class="form-control"
                                   th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].countCells}">
                        </div>

                        <div class="col-md-3">
                            <label>Ширина</label>

                            <input type="number"
                                   class="form-control"
                                   th:field="*{alsList[__${item.index}__].lbList[__${lbItem.index}__].width}">
                        </div>

                    </div>

                    <div class="mt-2">

                        <a th:href="@{/projects/{projectId}/alss/{alsId}/lbs/{lbId}(
                                    projectId=${project.id},
                                    alsId=${als.id},
                                    lbId=${lb.id})}"
                           class="btn btn-primary btn-sm">
                            Редактировать
                        </a>

                    </div>

                </div>

                <button type="submit"
                        class="btn btn-primary btn-sm"
                        th:formaction="@{/projects/{projectId}/alss/{alsId}/addLB(
                                    projectId=${project.id},
                                    alsId=${als.id})}">
                    Добавить LB
                </button>

                <button type="submit"
                        class="btn btn-info btn-sm">
                    Сохранить изменения
                </button>

                <a th:href="@{/projects/{projectId}/alss/{alsId}(
                            projectId=${project.id},
                            alsId=${als.id})}"
                   class="btn btn-secondary btn-sm">
                    Открыть ALS
                </a>

                <button type="submit"
                        class="btn btn-danger btn-sm"
                        th:formaction="@{/projects/{projectId}/alss/{alsId}/delete(
                                    projectId=${project.id},
                                    alsId=${als.id})}">
                    Удалить ALS
                </button>

            </div>

        </div>

    </form>

</div>

<div th:replace="~{footer :: footer}"></div>

</body>
</html>
