<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Мои проекты')}"></head>
<body>
<div th:replace="~{header :: header}"></div>
<div class="container-fluid">
  <h1>Мои Проекты</h1>
  <a href="/projects/create" class="btn btn-primary btn-sm mb-3">Создать проект </a>
  <a th:href="@{'/'}" class="btn btn-primary btn-sm mb-3">Back </a>
  <br/><br/>
  <table border="1" class="table table-striped table-responsive-md">
    <thead>
    <tr>
      <th>ID</th>
      <th>Company</th>
      <th>Description</th>
      <th>Created Date</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="project : ${projects}">
      <td th:text="${project.getId()}">ID</td>
      <td th:text="${project.getCompany()}">Company</td>
      <td th:text="${project.getDescription()}">Description</td>
      <td th:text="${project.getCreatedDate()}">CreatedAt</td>
      <td>
        <a th:href="@{/projects/{id}(id=${project.getId()})}" class="btn btn-primary">Edit</a>
      </td>
    </tr>
    </tbody>
  </table>
</div>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
