<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Мои проекты')}"></head>
<body>
<div th:replace="~{header :: header}"></div>
<div class="container">
  <h1>Мои Проекты</h1>
  <a th:href="@{/projects/create}" class="btn btn-primary btn-sm mb-3">Создать проект </a>
  <a th:href="@{/}" class="btn btn-primary btn-sm mb-3">Назад</a>
  
  <div class="table-responsive">
  <table class="table table-striped">
    <thead>
    <tr>
      <th>ID</th>
      <th>Компания</th>
      <th>Описание</th>
      <th>Дата создания</th>
      <th>Действие</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="project : ${projects}">
      <td th:text="${project.getId()}">ID</td>
      <td th:text="${project.getCompany()}">Company</td>
      <td th:text="${project.getDescription()}">Description</td>
      <td th:text="${project.getCreatedDate()}">CreatedAt</td>
      <td>
        <a th:href="@{/projects/{id}(id=${project.getId()})}" class="btn btn-primary btn-sm">Открыть</a>
      </td>
    </tr>
    </tbody>
  </table>
  </div>
</div>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
