<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>ALS проекта</title>

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8eJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>

<body>

<div th:replace="~{header :: header}"></div>

<div class="container-fluid">

    <br>

    <form th:action="@{/projects/{projectId}/alss/{alsId}/save(
                projectId=${projectId},
                alsId=${alsId})}"
          th:object="${als}"
          method="post">

        <div class="mb-3">

            <button type="submit"
                    class="btn btn-primary btn-sm">
                Сохранить ALS
            </button>

            <a th:href="@{/projects/{id}(id=${projectId})}"
               class="btn btn-secondary btn-sm">
                Назад к проекту
            </a>

        </div>

        <div th:if="${ALSErrors != null}"
             class="alert alert-danger">

            <div th:each="error : ${ALSErrors}"
                 th:text="${error}">
            </div>

        </div>

        <div class="card mb-4">

            <div class="card-header">
                <h3 th:text="${als.name}">
                    ALS
                </h3>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-2">
                        <label>ID</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{id}"
                               readonly>
                    </div>

                    <div class="col-md-5">
                        <label>Название</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{name}"
                               readonly>
                    </div>

                    <div class="col-md-5">
                        <label>Описание</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{description}"
                               readonly>
                    </div>

                </div>

                <div class="row mt-3">

                    <div class="col-md-2">
                        <label>Положение LC</label>

                        <select class="form-control"
                                th:field="*{positionLC}">

                            <option th:each="position : ${positionLCList}"
                                    th:value="${position}"
                                    th:text="${position}">
                            </option>

                        </select>
                    </div>

                    <div class="col-md-2">
                        <label>Количество ячеек</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{countCells}"
                               readonly>
                    </div>

                    <div class="col-md-2">
                        <label>Высота</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{height}">
                    </div>

                    <div class="col-md-2">
                        <label>Ширина</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{width}"
                               readonly>
                    </div>

                    <div class="col-md-2">
                        <label>Глубина</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{depth}">
                    </div>

                    <div class="col-md-2">
                        <label>Глубина ячейки</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{depthCell}"
                               readonly>
                    </div>

                </div>

                <div class="row mt-3">

                    <div class="col-md-3">
                        <label>Верхняя рама</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{upperFrame}">
                    </div>

                    <div class="col-md-3">
                        <label>Нижняя рама</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{bottomFrame}">
                    </div>

                    <div class="col-md-3">
                        <label>Цвет корпуса</label>

                        <select class="form-control"
                                th:field="*{colorBody}">

                            <option th:each="color : ${colorsList}"
                                    th:value="${color}"
                                    th:text="${color}">
                            </option>

                        </select>
                    </div>

                    <div class="col-md-3">
                        <label>Цвет дверей</label>

                        <select class="form-control"
                                th:field="*{colorDoor}">

                            <option th:each="color : ${colorsList}"
                                    th:value="${color}"
                                    th:text="${color}">
                            </option>

                        </select>
                    </div>

                </div>

            </div>

        </div>

        <!-- LC -->

        <div class="card mb-4"
             th:if="${als.LC != null}">

            <div class="card-header">
                <h4 th:text="${als.LC.description}">
                    Модуль управления
                </h4>
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-2">
                        <label>ID</label>
                        <input type="number"
                               class="form-control"
                               th:value="${als.LC.id}"
                               readonly>
                    </div>

                    <div class="col-md-2">
                        <label>Display</label>

                        <input type="text"
                               class="form-control"
                               th:value="${als.LC.display}"
                               readonly>
                    </div>

                    <div class="col-md-2">
                        <label>Payment</label>

                        <input type="text"
                               class="form-control"
                               th:value="${als.LC.payment}"
                               readonly>
                    </div>

                    <div class="col-md-2">
                        <label>Printer</label>

                        <input type="text"
                               class="form-control"
                               th:value="${als.LC.printer}"
                               readonly>
                    </div>

                    <div class="col-md-2">
                        <label>BarReader</label>

                        <input type="text"
                               class="form-control"
                               th:value="${als.LC.barReader}"
                               readonly>
                    </div>

                    <div class="col-md-2">
                        <label>RFID</label>

                        <input type="text"
                               class="form-control"
                               th:value="${als.LC.rfidReader}"
                               readonly>
                    </div>

                </div>

                <div class="mt-3">

                    <a th:href="@{/projects/{projectId}/alss/{alsId}/lcs/{lcId}(
                                projectId=${projectId},
                                alsId=${alsId},
                                lcId=${als.LC.id})}"
                       class="btn btn-primary btn-sm">
                        Редактировать LC
                    </a>

                </div>

            </div>

        </div>

        <!-- LB -->

        <div class="card mb-4">

            <div class="card-header">
                <h4>Модули хранения</h4>
            </div>

            <div class="card-body">

                <div th:if="${LBErrors != null}"
                     class="alert alert-danger">

                    <div th:each="error : ${LBErrors}">
                        <span th:text="${error}"></span>
                    </div>

                </div>

                <div th:each="lb, item : ${als.lbList}"
                     class="border rounded p-3 mb-3">

                    <div class="row">

                        <div class="col-md-2">
                            <label>ID</label>
                            <input type="number"
                                   class="form-control"
                                   th:value="${lb.id}"
                                   readonly>
                        </div>

                        <div class="col-md-4">
                            <label>Название</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${lb.name}"
                                   readonly>
                        </div>

                        <div class="col-md-3">
                            <label>Тип</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${lb.type}"
                                   readonly>
                        </div>

                        <div class="col-md-3">
                            <label>Ячеек</label>
                            <input type="number"
                                   class="form-control"
                                   th:value="${lb.countCells}"
                                   readonly>
                        </div>

                    </div>

                    <div class="mt-3">

                        <a th:href="@{/projects/{projectId}/alss/{alsId}/lbs/{lbId}(
                                    projectId=${projectId},
                                    alsId=${alsId},
                                    lbId=${lb.id})}"
                           class="btn btn-primary btn-sm">
                            Редактировать
                        </a>

                        <button type="submit"
                                class="btn btn-danger btn-sm"
                                th:formaction="@{/projects/{projectId}/alss/{alsId}/lbs/{lbId}/delete(
                                    projectId=${projectId},
                                    alsId=${alsId},
                                    lbId=${lb.id})}">
                            Удалить
                        </button>

                    </div>

                </div>

                <button type="submit"
                        class="btn btn-primary btn-sm"
                        th:formaction="@{/projects/{projectId}/alss/{alsId}/addLB(
                                    projectId=${projectId},
                                    alsId=${alsId})}">
                    Добавить LB
                </button>

            </div>

        </div>

    </form>

</div>

<div th:replace="~{footer :: footer}"></div>

</body>
</html>
