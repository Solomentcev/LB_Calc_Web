<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/common :: head('АКХ в проекте')}"></head>

<body>

<div th:replace="~{header :: header}"></div>

<div class="container">

    <nav aria-label="breadcrumb" class="mt-3"><ol class="breadcrumb"><li class="breadcrumb-item"><a th:href="@{/projects/{id}(id=${projectId})}" th:text="${project.name}">Проект</a></li><li class="breadcrumb-item active" aria-current="page" th:text="${als.name}">АКХ</li></ol></nav>


    <form th:action="@{/projects/{projectId}/alss/{alsId}/save(
                projectId=${projectId},
                alsId=${alsId})}"
          th:object="${als}"
          method="post">

        <div class="mb-3">

            <button type="submit"
                    class="btn btn-primary btn-sm">
                Сохранить ALS
            </button>

            <a th:href="@{/projects/{id}(id=${projectId})}"
               class="btn btn-secondary btn-sm">
                Назад к проекту
            </a>

        </div>

        <div th:if="${ALSErrors != null}"
             class="alert alert-danger">

            <div th:each="error : ${ALSErrors}"
                 th:text="${error}">
            </div>

        </div>

        <div class="card mb-4">

            <div class="card-header">
                <h1 class="h4 mb-0" th:text="${als.name}">
                    ALS
                </h1>
                <img class="img-fluid mt-3"
                     th:if="${als.stringALSImage != null}"
                     th:src="|data:image/png;base64,${als.stringALSImage}|"
                     alt="Изображение АКХ">
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-2">
                        <label>ID</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{id}"
                               readonly aria-label="id">
                    </div>

                    <div class="col-md-5">
                        <label>Название</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{name}"
                               readonly aria-label="name">
                    </div>

                    <div class="col-md-5">
                        <label>Описание</label>
                        <input type="text"
                               class="form-control"
                               th:field="*{description}"
                               readonly aria-label="description">
                    </div>

                </div>

                <div class="row mt-3">

                    <div class="col-md-2">
                        <label>Положение модуля управления</label>

                        <select class="form-control"
                                th:field="*{positionControlModule}" aria-label="positionControlModule">

                            <option th:each="position : ${positionControlModuleList}"
                                    th:value="${position}"
                                    th:text="${position}">
                            </option>

                        </select>
                    </div>

                    <div class="col-md-2">
                        <label>Количество ячеек</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{countCells}"
                               readonly aria-label="countCells">
                    </div>

                    <div class="col-md-2">
                        <label>Высота</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{height}" aria-label="height">
                    </div>

                    <div class="col-md-2">
                        <label>Ширина</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{width}"
                               readonly aria-label="width">
                    </div>

                    <div class="col-md-2">
                        <label>Глубина</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{depth}" aria-label="depth">
                    </div>

                    <div class="col-md-2">
                        <label>Глубина ячейки</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{depthCell}"
                               readonly aria-label="depthCell">
                    </div>

                </div>

                <div class="row mt-3">

                    <div class="col-md-3">
                        <label>Верхняя рама</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{upperFrame}" aria-label="upperFrame">
                    </div>

                    <div class="col-md-3">
                        <label>Нижняя рама</label>
                        <input type="number"
                               class="form-control"
                               th:field="*{bottomFrame}" aria-label="bottomFrame">
                    </div>

                    <div class="col-md-3">
                        <label>Цвет корпуса</label>

                        <select class="form-control"
                                th:field="*{colorBody}" aria-label="colorBody">

                            <option th:each="color : ${colorsList}"
                                    th:value="${color}"
                                    th:text="${color}">
                            </option>

                        </select>
                    </div>

                    <div class="col-md-3">
                        <label>Цвет дверей</label>

                        <select class="form-control"
                                th:field="*{colorDoor}" aria-label="colorDoor">

                            <option th:each="color : ${colorsList}"
                                    th:value="${color}"
                                    th:text="${color}">
                            </option>

                        </select>
                    </div>

                </div>

            </div>

        </div>

        <!-- LC -->

        <div class="card mb-4"
             th:if="${als.LC != null}">

            <div class="card-header">
                <h4 th:text="${als.LC.description}">Модуль управления</h4>
                <img class="img-thumbnail mt-2" th:if="${als.LC.stringLCImage != null}" th:src="|data:image/png;base64,${als.LC.stringLCImage}|" alt="Чертёж LC">
            </div>

            <div class="card-body">

                <!-- Сохраняем неизменяемую конфигурацию LC при отправке формы ALS. -->
                <input type="hidden" th:field="*{LC.id}">
                <input type="hidden" th:field="*{LC.name}">
                <input type="hidden" th:field="*{LC.description}">
                <input type="hidden" th:field="*{LC.height}">
                <input type="hidden" th:field="*{LC.width}">
                <input type="hidden" th:field="*{LC.depth}">
                <input type="hidden" th:field="*{LC.upperFrame}">
                <input type="hidden" th:field="*{LC.bottomFrame}">
                <input type="hidden" th:field="*{LC.display}">
                <input type="hidden" th:field="*{LC.barReader}">
                <input type="hidden" th:field="*{LC.payment}">
                <input type="hidden" th:field="*{LC.printer}">
                <input type="hidden" th:field="*{LC.rfidReader}">
                <input type="hidden" th:field="*{LC.displayQuantity}">
                <input type="hidden" th:field="*{LC.barReaderQuantity}">
                <input type="hidden" th:field="*{LC.printerQuantity}">
                <input type="hidden" th:field="*{LC.rfidReaderQuantity}">
                <input type="hidden" th:field="*{LC.colorBody}">
                <input type="hidden" th:field="*{LC.colorDoor}">
                <input type="hidden" th:field="*{LC.displayWidth}">
                <input type="hidden" th:field="*{LC.displayHeight}">
                <input type="hidden"
                       th:each="method, methodStat : ${als.LC.accessMethods}"
                       th:name="|LC.accessMethods[${methodStat.index}]|"
                       th:value="${method}">
                <input type="hidden"
                       th:each="option, optionStat : ${als.LC.printOptions}"
                       th:name="|LC.printOptions[${optionStat.index}]|"
                       th:value="${option}">
                <input type="hidden"
                       th:each="selection, selectionStat : ${als.LC.equipmentSelections}"
                       th:name="|LC.equipmentSelections[${selectionStat.index}].catalogPositionId|"
                       th:value="${selection.catalogPositionId}">
                <input type="hidden"
                       th:each="selection, selectionStat : ${als.LC.equipmentSelections}"
                       th:name="|LC.equipmentSelections[${selectionStat.index}].quantity|"
                       th:value="${selection.quantity}">


                <div class="row">

                    <div class="col-md-2">
                        <label>ID</label>
                        <input type="number"
                               class="form-control"
                               th:value="${als.LC.id}"
                               readonly aria-label="Поле формы">
                    </div>

                    <div class="col-md-2">
                        <label>Дисплей</label>

                        <input type="text"
                               class="form-control"
                               th:value="${als.LC.display}"
                               readonly aria-label="Поле формы">
                    </div>

                    <div class="col-md-2">
                        <label>Оплата</label>

                        <input type="text"
                               class="form-control"
                               th:value="${als.LC.payment}"
                               readonly aria-label="Поле формы">
                    </div>

                    <div class="col-md-2">
                        <label>Принтер</label>

                        <input type="text"
                               class="form-control"
                               th:value="${als.LC.printer}"
                               readonly aria-label="Поле формы">
                    </div>

                    <div class="col-md-2">
                        <label>Сканер штрихкодов</label>

                        <input type="text"
                               class="form-control"
                               th:value="${als.LC.barReader}"
                               readonly aria-label="Поле формы">
                    </div>

                    <div class="col-md-2">
                        <label>RFID-считыватель</label>

                        <input type="text"
                               class="form-control"
                               th:value="${als.LC.rfidReader}"
                               readonly aria-label="Поле формы">
                    </div>

                </div>

                <div class="mt-3">

                    <a th:href="@{/projects/{projectId}/alss/{alsId}/lcs/{lcId}(
                                projectId=${projectId},
                                alsId=${alsId},
                                lcId=${als.LC.id})}"
                       class="btn btn-primary btn-sm">
                        Редактировать LC
                    </a>

                </div>

            </div>

        </div>


        <!-- LBC -->

        <div th:if="${als.LBC != null}"
             class="card mb-4">

            <div class="card-header">
                <h4 th:text="${'LBC — ' + als.LBC.name}">LBC</h4>
                <img class="img-thumbnail mt-2" th:if="${als.LBC.stringLBCImage != null}" th:src="|data:image/png;base64,${als.LBC.stringLBCImage}|" alt="Чертёж LBC">
            </div>

            <div class="card-body">
                <input type="hidden" th:field="*{LBC.id}">
                <input type="hidden" th:field="*{LBC.name}">
                <input type="hidden" th:field="*{LBC.description}">
                <input type="hidden" th:field="*{LBC.type}">
                <input type="hidden" th:field="*{LBC.height}">
                <input type="hidden" th:field="*{LBC.width}">
                <input type="hidden" th:field="*{LBC.depth}">
                <input type="hidden" th:field="*{LBC.upperFrame}">
                <input type="hidden" th:field="*{LBC.bottomFrame}">
                <input type="hidden" th:field="*{LBC.shelfThick}">
                <input type="hidden" th:field="*{LBC.deltaWidth}">
                <input type="hidden" th:field="*{LBC.serviceZoneWidth}">
                <input type="hidden" th:field="*{LBC.doorThickness}">
                <input type="hidden" th:field="*{LBC.countCells}">
                <input type="hidden" th:field="*{LBC.heightCell}">
                <input type="hidden" th:field="*{LBC.widthCell}">
                <input type="hidden" th:field="*{LBC.depthCell}">
                <input type="hidden" th:field="*{LBC.directionDoorOpening}">
                <input type="hidden" th:field="*{LBC.colorBody}">
                <input type="hidden" th:field="*{LBC.colorDoor}">
                <input type="hidden" th:field="*{LBC.display}">
                <input type="hidden" th:field="*{LBC.barReader}">
                <input type="hidden" th:field="*{LBC.payment}">
                <input type="hidden" th:field="*{LBC.printer}">
                <input type="hidden" th:field="*{LBC.rfidReader}">

                <input type="hidden"
                       th:each="method, methodStat : ${als.LBC.accessMethods}"
                       th:name="|LBC.accessMethods[${methodStat.index}]|"
                       th:value="${method}">
                <input type="hidden"
                       th:each="option, optionStat : ${als.LBC.printOptions}"
                       th:name="|LBC.printOptions[${optionStat.index}]|"
                       th:value="${option}">

                <div class="row">
                    <div class="col-md-2">
                        <strong>ID:</strong>
                        <span th:text="${als.LBC.id}"></span>
                    </div>
                    <div class="col-md-2">
                        <strong>Тип:</strong>
                        <span th:text="${als.LBC.type}"></span>
                    </div>
                    <div class="col-md-2">
                        <strong>Ячеек:</strong>
                        <span th:text="${als.LBC.countCells}"></span>
                    </div>
                    <div class="col-md-3">
                        <strong>Display:</strong>
                        <span th:text="${als.LBC.display}"></span>
                    </div>
                    <div class="col-md-3">
                        <strong>Payment:</strong>
                        <span th:text="${als.LBC.payment}"></span>
                    </div>
                </div>

                <a th:href="@{/projects/{projectId}/alss/{alsId}/lbcs/{lbcId}(
                            projectId=${projectId},
                            alsId=${alsId},
                            lbcId=${als.LBC.id})}"
                   class="btn btn-primary btn-sm">
                    Редактировать LBC
                </a>
            </div>
        </div>

        <!-- LB -->

        <div class="card mb-4">

            <div class="card-header">
                <h4>Модули хранения</h4>
            </div>

            <div class="card-body">

                <div th:if="${LBErrors != null}"
                     class="alert alert-danger">

                    <div th:each="error : ${LBErrors}">
                        <span th:text="${error}"></span>
                    </div>

                </div>

                <div th:each="lb, item : ${als.lbList}"
                     class="border rounded p-3 mb-3">
                    <img class="img-thumbnail mb-3" th:if="${lb.stringLBImage != null}" th:src="|data:image/png;base64,${lb.stringLBImage}|" alt="Чертёж LB">

                    <div class="row">

                        <div class="col-md-2">
                            <label>ID</label>
                            <input type="number"
                                   class="form-control"
                                   th:value="${lb.id}"
                                   readonly aria-label="Поле формы">
                        </div>

                        <div class="col-md-4">
                            <label>Название</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${lb.name}"
                                   readonly aria-label="Поле формы">
                        </div>

                        <div class="col-md-3">
                            <label>Тип</label>
                            <input type="text"
                                   class="form-control"
                                   th:value="${lb.type}"
                                   readonly aria-label="Поле формы">
                        </div>

                        <div class="col-md-3">
                            <label>Ячеек</label>
                            <input type="number"
                                   class="form-control"
                                   th:value="${lb.countCells}"
                                   readonly aria-label="Поле формы">
                        </div>

                    </div>

                    <div class="mt-3">

                        <a th:href="@{/projects/{projectId}/alss/{alsId}/lbs/{lbId}(
                                    projectId=${projectId},
                                    alsId=${alsId},
                                    lbId=${lb.id})}"
                           class="btn btn-primary btn-sm">
                            Редактировать
                        </a>

                        <button type="submit"
                                class="btn btn-danger btn-sm"
                                th:formaction="@{/projects/{projectId}/alss/{alsId}/lbs/{lbId}/delete(
                                    projectId=${projectId},
                                    alsId=${alsId},
                                    lbId=${lb.id})}">
                            Удалить
                        </button>

                    </div>

                </div>

                <button type="submit"
                        class="btn btn-primary btn-sm"
                        th:formaction="@{/projects/{projectId}/alss/{alsId}/addLB(
                                    projectId=${projectId},
                                    alsId=${alsId})}">
                    Добавить LB
                </button>

            </div>

        </div>

    </form>

</div>

<div th:replace="~{footer :: footer}"></div>

</body>
</html>
