<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/common :: head('Модуль хранения в проекте')}"></head>

<body>

<div th:replace="~{header :: header}"></div>

<div class="container">
<nav aria-label="breadcrumb" class="mt-3"><ol class="breadcrumb"><li class="breadcrumb-item"><a th:href="@{/projects/{id}(id=${projectId})}" th:text="|${project.name} (ID: ${projectId})|">Проект</a></li><li class="breadcrumb-item"><a th:href="@{/projects/{projectId}/alss/{alsId}(projectId=${projectId},alsId=${alsId})}" th:text="|${als.name} (ID: ${alsId})|">АКХ</a></li><li class="breadcrumb-item active" aria-current="page" th:text="|${lb.description} (ID: ${lb.id})|">Модуль хранения</li></ol></nav>


    <form th:action="@{/projects/{projectId}/alss/{alsId}/lbs/{lbId}/save(
                projectId=${projectId},
                alsId=${alsId},
                lbId=${lbId})}"
          th:object="${lb}"
          method="post">

        <div class="mb-3">

            <button type="submit"
                    class="btn btn-primary btn-sm">
                Сохранить LB
            </button>

            <a th:href="@{/projects/{projectId}/alss/{alsId}(
                        projectId=${projectId},
                        alsId=${alsId})}"
               class="btn btn-secondary btn-sm">
                Назад к ALS
            </a>

            <a th:href="@{/projects/{projectId}(
                        projectId=${projectId})}"
               class="btn btn-secondary btn-sm">
                Назад к проекту
            </a>

        </div>

        <div th:if="${errors != null}"
             class="alert alert-danger">

            <div th:each="error : ${errors}"
                 th:text="${error}">
            </div>

        </div>

        <div class="card">

            <div class="card-header">

                <h1 class="h4 mb-0" th:text="${lb.description}">
                    Модуль хранения
                </h1>
                <img class="img-thumbnail mt-2" th:if="${lb.stringLBImage != null}" th:src="|data:image/png;base64,${lb.stringLBImage}|" alt="Чертёж LB">
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-2">
                        <label>ID</label>

                        <input type="number"
                               class="form-control"
                               th:field="*{id}"
                               readonly aria-label="id">
                    </div>

                    <div class="col-md-5">
                        <label>Название</label>

                        <input type="text"
                               class="form-control"
                               th:field="*{name}"
                               readonly aria-label="name">
                    </div>

                    <div class="col-md-5">
                        <label>Тип</label>

                        <select class="form-control"
                                th:field="*{type}" aria-label="type">

                            <option th:each="type : ${typeLbList}"
                                    th:value="${type}"
                                    th:text="${type}">
                            </option>

                        </select>
                    </div>

                </div>

                <div class="row mt-3">

                    <div class="col-md-3">
                        <label>Количество ячеек</label>

                        <input type="number"
                               class="form-control"
                               th:field="*{countCells}" aria-label="countCells">
                    </div>

                    <div class="col-md-3">
                        <label>Ширина</label>

                        <input type="number"
                               class="form-control"
                               th:field="*{width}" aria-label="width">
                    </div>

                    <div class="col-md-3">
                        <label>Высота</label>

                        <input type="number"
                               class="form-control"
                               th:field="*{height}"
                               readonly aria-label="height">
                    </div>

                    <div class="col-md-3">
                        <label>Глубина</label>

                        <input type="number"
                               class="form-control"
                               th:field="*{depth}"
                               readonly aria-label="depth">
                    </div>

                </div>

                <div class="row mt-3">

                    <div class="col-md-3">
                        <label>Высота ячейки</label>

                        <input type="number"
                               class="form-control"
                               th:field="*{heightCell}"
                               readonly aria-label="heightCell">
                    </div>

                    <div class="col-md-3">
                        <label>Ширина ячейки</label>

                        <input type="number"
                               class="form-control"
                               th:field="*{widthCell}"
                               readonly aria-label="widthCell">
                    </div>

                    <div class="col-md-3">
                        <label>Глубина ячейки</label>

                        <input type="number"
                               class="form-control"
                               th:field="*{depthCell}"
                               readonly aria-label="depthCell">
                    </div>

                    <div class="col-md-3">
                        <label>Полка</label>

                        <input type="number"
                               class="form-control"
                               th:field="*{shelfThick}"
                               readonly aria-label="shelfThick">
                    </div>

                </div>

                <div class="row mt-3">

                    <div class="col-md-3">
                        <label>Направление двери</label>

                        <input type="text"
                               class="form-control"
                               th:field="*{directionDoorOpening}"
                               readonly aria-label="directionDoorOpening">
                    </div>

                    <div class="col-md-3">
                        <label>Цвет корпуса</label>

                        <input type="text"
                               class="form-control"
                               th:field="*{colorBody}"
                               readonly aria-label="colorBody">
                    </div>

                    <div class="col-md-3">
                        <label>Цвет дверей</label>

                        <input type="text"
                               class="form-control"
                               th:field="*{colorDoor}"
                               readonly aria-label="colorDoor">
                    </div>

                    <div class="col-md-3">
                        <label>Толщина двери</label>

                        <input type="number"
                               class="form-control"
                               min="5"
                               max="50"
                               th:field="*{doorThickness}"
                               aria-label="doorThickness">
                    </div>

                </div>

                <input type="hidden"
                       th:field="*{description}">

                <input type="hidden"
                       th:field="*{upperFrame}">

                <input type="hidden"
                       th:field="*{bottomFrame}">

                <input type="hidden"
                       th:field="*{deltaWidth}">

                <input type="hidden"
                       th:field="*{serviceZoneWidth}">

            </div>

        </div>

    </form>

</div>

<div th:replace="~{footer :: footer}"></div>

</body>
</html>
