<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>LB_Calc_WEB</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>
<div class="container">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div th:if="${error}" style="background:#ffdddd;padding:10px;margin-bottom:10px;border:1px solid red;">
                <span th:text="${error}"></span>
            </div>

            <div th:if="${successMessage}!=null" style="background:#ddffdd;padding:10px;margin-bottom:10px;border:1px solid green;">
                <span th:text="${successMessage}"></span>
            </div>
            <div class="card">
                <div class="card-header text-center">
                    <h2 class="text-center">Сменить пароль</h2>
                </div>
                <div class="card-body">
                    <form method="post" th:object="${changePassword}" th:action="@{/myprofile/changepassword}" class="form-horizontal">
                        <div class="form-group mb-3">
                            <label class="control-label" for="password"> Пароль</label>
                            <input
                                    type="password"
                                    id="password"
                                    th:field="*{password}"
                                    class="form-control"
                                    placeholder="Введите пароль"
                            />
                            <div th:if="${#fields.hasErrors('password')}" style="color:red">
                                <p th:each="e : ${#fields.errors('password')}" th:text="${e}"></p>
                            </div>
                        </div>

                        <div class="form-group mb-3">
                            <label class="control-label" for="confirmPassword">Повторите пароль</label>
                            <input
                                    type="password"
                                    id="confirmPassword"
                                    th:field="*{confirmPassword}"
                                    class="form-control"
                                    placeholder="Повторите пароль"
                            />
                            <div th:if="${#fields.hasErrors('confirmPassword')}" style="color:red">
                                <p th:each="e : ${#fields.errors('confirmPassword')}" th:text="${e}"></p>
                            </div>
                        </div>
                        <div class="form-group mb-3">
                            <button type="submit" class="btn btn-primary">Подтвердить</button>
                            <a th:href="@{/myprofile}" class="btn btn-secondary">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
