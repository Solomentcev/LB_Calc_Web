<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Модуль хранения')}"></head>
<body>
<div th:replace="~{header :: header}"></div>
<div class="container">
    
    <form action="#" th:action="@{/lbs/save}" th:object="${lb}" method="post">

        <p  th:each="erorr, item: ${errors}" class="alert alert-danger"
            th:text="${item.current}"></p>

        <button type="submit" class="btn btn-primary btn-sm mb-3">Сохранить Модуль хранения</button>
        <a th:href="@{'/lbs'}" class="btn btn-primary btn-sm mb-3"
        >К списку модулей хранения</a>
        
        <h4 th:text="*{description}">Модуль хранения</h4>
        <label hidden="hidden">
            <input size="130"  type="text" th:field="*{description}" readonly="readonly">
        </label>

    <table class="table table-striped">
        <tr>
            <th >ID</th>
            <td>
                <label>
                     <input type="number" size="3" th:field="*{id}" readonly="readonly">
                </label>
            </td>
            <td rowspan="16">
                <div class="container">
                    <img class="img-thumbnail" th:src="'data:image/png;base64,'+${lb.getStringLBImage()}" alt="LB Image">
                </div>
            </td>
        </tr>
        <tr>
            <th>Название</th>
            <td>
                <label>
                    <input  size="30" type="text" height="" th:field="*{name}" readonly="readonly">
                </label>
            </td>
        </tr>
        <tr>
            <th>Тип</th>
            <td>
                <label>
                    <select th:field="*{type}">
                        <option th:each="type:${typeLbList}"
                                th:value="${type}"
                                th:text="${type}">
                        </option>
                    </select>
                </label>
            </td>
        </tr>
        <tr>
            <th>Толщина полки</th>
            <td>
                <label>
                    <input type="number" size="3" th:field="*{shelfThick}" readonly="readonly">
                </label>
            </td>
        </tr>
        <tr>
            <th>Количество ячеек</th>
            <td>
                <label>
                    <input type="number" min="1"  size="3" th:field="*{countCells}">
                </label>
            </td>
        </tr>
        <tr>
            <th>Высота</th>
            <td>
                <label>
                    <input type="number" size="4" th:field="*{height}">
                </label>
            </td>
        </tr>
        <tr>
            <th>Ширина</th>
            <td>
                <label>
                    <input type="number" size="4" th:field="*{width}">
                </label>
            </td>
        </tr>
        <tr>
            <th>Глубина</th>
            <td>
                <label>
                    <input type="number" size="4" th:field="*{depth}">
                </label>
            </td>
        </tr>
        <tr>
            <th>Верхняя рама</th>
            <td>
                <label>
                    <input type="number" size="4" th:field="*{upperFrame}">
                </label>
            </td>
        </tr>
        <tr>
            <th>Нижняя рама</th>
            <td>
            <label>
                <input type="number" size="4" th:field="*{bottomFrame}">
            </label>
            </td>
        </tr>
        <tr>
            <th>Высота ячейки</th>
            <td>
                <label>
                    <input  type="number" size="4" th:field="*{heightCell}" readonly="readonly">
                </label>
            </td>
        </tr>
        <tr>
            <th>Ширина ячейки</th>
            <td>
                <label>
                <input type="number" size="4" th:field="*{widthCell}" readonly="readonly">
            </label>
            </td>
        </tr>
        <tr>
            <th>Глубина ячейки</th>
            <td>
                <label>
                    <input type="number" size="4" th:field="*{depthCell}" readonly="readonly">
                </label>
            </td>
        </tr>
        <tr>
            <th>Направление открывания двери</th>
            <td>
                <label>
                    <select th:field="*{directionDoorOpening}">
                        <option th:each="directionDoorOpening:${directionDoorOpeningList}"
                                th:value="${directionDoorOpening}"
                                th:text="${directionDoorOpening}">
                        </option>
                    </select>
                </label>
            </td>
        </tr>
        <tr>
            <th>Цвет корпуса</th>
            <td>
                <label>
                    <select th:field="*{colorBody}">
                        <option th:each="color:${colorsList}" th:value="${color}" th:text="${color}">
                        </option>
                    </select>
                </label>
            </td>
        </tr>
        <tr>
            <th>Цвет дверей</th>
            <td>
            <label>
                <select th:field="*{colorDoor}">
                    <option th:each="color:${colorsList}" th:value="${color}" th:text="${color}">
                    </option>
                </select>
            </label>
            </td>
        </tr>
    </table>
    </form>
</div>

<div th:replace="~{footer :: footer}"></div>
</body>
</html>
