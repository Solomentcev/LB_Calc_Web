<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Модули управления')}"></head>
<body>
<div th:replace="~{header :: header}"></div>
<main class="container">
    <h1 class="page-title">Модули управления LC</h1>
    <div class="page-actions">
        <a th:href="@{/lcs/create}" class="btn btn-primary btn-sm">Создать LC</a>
        <a th:href="@{/}" class="btn btn-secondary btn-sm">Назад</a>
    </div>
    <form id="lc-filter-form" th:action="@{/lcs}" method="get" class="mb-2">
        <input type="hidden" name="page" value="0">
        <input type="hidden" name="sort" th:value="${sort}">
        <input type="hidden" name="direction" th:value="${direction}">
        <input type="hidden" name="size" th:value="${size}">
        <button type="submit" class="btn btn-outline-primary btn-sm">Применить фильтры</button>
        <a th:href="@{/lcs}" class="btn btn-outline-secondary btn-sm">Сбросить</a>
    </form>
    <form id="lc-sort-form" th:action="@{/lcs}" method="get" class="form-inline mb-3">
        <input type="hidden" name="page" value="0">
        <input type="hidden" name="id" th:value="${filters.id}">
        <input type="hidden" name="name" th:value="${filters.name}">
        <input type="hidden" name="heightMin" th:value="${filters.heightMin}"><input type="hidden" name="heightMax" th:value="${filters.heightMax}">
        <input type="hidden" name="widthMin" th:value="${filters.widthMin}"><input type="hidden" name="widthMax" th:value="${filters.widthMax}">
        <input type="hidden" name="depthMin" th:value="${filters.depthMin}"><input type="hidden" name="depthMax" th:value="${filters.depthMax}">
        <input type="hidden" name="displayPurpose" th:value="${filters.displayPurpose}"><input type="hidden" name="accessPurpose" th:value="${filters.accessPurpose}">
        <input type="hidden" name="paymentPurpose" th:value="${filters.paymentPurpose}"><input type="hidden" name="printerPurpose" th:value="${filters.printerPurpose}">
        <input type="hidden" name="colorBody" th:value="${filters.colorBody}"><input type="hidden" name="colorDoor" th:value="${filters.colorDoor}">
        <label class="mr-2" for="lc-sort">Сортировка</label>
        <select id="lc-sort" class="form-control form-control-sm mr-2" name="sort">
            <option value="id" th:selected="${sort == 'id'}">ID</option><option value="name" th:selected="${sort == 'name'}">Название</option>
            <option value="height" th:selected="${sort == 'height'}">Высота</option><option value="width" th:selected="${sort == 'width'}">Ширина</option>
            <option value="depth" th:selected="${sort == 'depth'}">Глубина</option><option value="displayPurpose" th:selected="${sort == 'displayPurpose'}">Display</option>
            <option value="accessSort" th:selected="${sort == 'accessSort'}">Access</option><option value="paymentPurpose" th:selected="${sort == 'paymentPurpose'}">Payment</option>
            <option value="printerPurpose" th:selected="${sort == 'printerPurpose'}">Printer</option><option value="colorBody" th:selected="${sort == 'colorBody'}">Цвет корпуса</option>
            <option value="colorDoor" th:selected="${sort == 'colorDoor'}">Цвет дверей</option>
        </select>
        <select class="form-control form-control-sm mr-2" name="direction"><option value="asc" th:selected="${direction == 'asc'}">По возрастанию</option><option value="desc" th:selected="${direction == 'desc'}">По убыванию</option></select>
        <select class="form-control form-control-sm mr-2" name="size"><option value="10" th:selected="${size == 10}">10</option><option value="20" th:selected="${size == 20}">20</option><option value="50" th:selected="${size == 50}">50</option><option value="100" th:selected="${size == 100}">100</option></select>
        <button type="submit" class="btn btn-outline-primary btn-sm">Применить</button>
    </form>
    <div class="table-responsive">
        <table class="table table-striped table-hover catalog-table">
            <thead>
            <tr><th>ID</th><th>Название</th><th>Высота</th><th>Ширина</th><th>Глубина</th><th>Display</th><th>Access</th><th>Payment</th><th>Printer</th><th>Цвет корпуса</th><th>Цвет дверей</th><th>Действия</th></tr>
            <tr>
                <th><input form="lc-filter-form" class="form-control form-control-sm" type="number" min="1" name="id" th:value="${filters.id}" placeholder="ID"></th>
                <th><input form="lc-filter-form" class="form-control form-control-sm" type="text" name="name" th:value="${filters.name}" placeholder="Содержит"></th>
                <th><input form="lc-filter-form" class="form-control form-control-sm" type="number" min="0" name="heightMin" th:value="${filters.heightMin}" placeholder="От"><input form="lc-filter-form" class="form-control form-control-sm mt-1" type="number" min="0" name="heightMax" th:value="${filters.heightMax}" placeholder="До"></th>
                <th><input form="lc-filter-form" class="form-control form-control-sm" type="number" min="0" name="widthMin" th:value="${filters.widthMin}" placeholder="От"><input form="lc-filter-form" class="form-control form-control-sm mt-1" type="number" min="0" name="widthMax" th:value="${filters.widthMax}" placeholder="До"></th>
                <th><input form="lc-filter-form" class="form-control form-control-sm" type="number" min="0" name="depthMin" th:value="${filters.depthMin}" placeholder="От"><input form="lc-filter-form" class="form-control form-control-sm mt-1" type="number" min="0" name="depthMax" th:value="${filters.depthMax}" placeholder="До"></th>
                <th><select form="lc-filter-form" class="form-control form-control-sm" name="displayPurpose"><option value="">Все</option><option th:each="v : ${displayPurposes}" th:value="${v}" th:text="${v}" th:selected="${v == filters.displayPurpose}"></option></select></th>
                <th><select form="lc-filter-form" class="form-control form-control-sm" name="accessPurpose"><option value="">Все</option><option th:each="v : ${accessPurposes}" th:value="${v}" th:text="${v}" th:selected="${v == filters.accessPurpose}"></option></select></th>
                <th><select form="lc-filter-form" class="form-control form-control-sm" name="paymentPurpose"><option value="">Все</option><option th:each="v : ${paymentPurposes}" th:value="${v}" th:text="${v}" th:selected="${v == filters.paymentPurpose}"></option></select></th>
                <th><select form="lc-filter-form" class="form-control form-control-sm" name="printerPurpose"><option value="">Все</option><option th:each="v : ${printerPurposes}" th:value="${v}" th:text="${v}" th:selected="${v == filters.printerPurpose}"></option></select></th>
                <th><select form="lc-filter-form" class="form-control form-control-sm" name="colorBody"><option value="">Все</option><option th:each="v : ${colorsList}" th:value="${v}" th:text="${v}" th:selected="${v == filters.colorBody}"></option></select></th>
                <th><select form="lc-filter-form" class="form-control form-control-sm" name="colorDoor"><option value="">Все</option><option th:each="v : ${colorsList}" th:value="${v}" th:text="${v}" th:selected="${v == filters.colorDoor}"></option></select></th><th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="lc : ${lcs}">
                <td th:text="${lc.id}"></td><td th:text="${lc.name}"></td><td th:text="${lc.height}"></td><td th:text="${lc.width}"></td><td th:text="${lc.depth}"></td>
                <td th:text="${lc.functionalConfiguration.display}"></td><td th:text="${lc.functionalConfiguration.accessDisplay}"></td><td th:text="${lc.functionalConfiguration.payment}"></td><td th:text="${lc.functionalConfiguration.printer}"></td>
                <td th:text="${lc.colorBody}"></td><td th:text="${lc.colorDoor}"></td><td><a th:href="@{/lcs/{id}(id=${lc.id})}" class="btn btn-primary btn-sm">Изменить</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(lcs)}"><td colspan="12" class="text-center">Нет модулей, соответствующих фильтрам</td></tr>
            </tbody>
        </table>
    </div>
    <nav th:if="${page.totalPages > 1}" aria-label="Навигация по страницам" class="d-flex align-items-center justify-content-between mb-3">
        <span class="text-muted small" th:text="${'Записи ' + (page.number * page.size + 1) + '–' + (page.number * page.size + page.numberOfElements) + ' из ' + page.totalElements}">Записи</span>
        <div>
            <a th:if="${page.hasPrevious()}" class="btn btn-outline-secondary btn-sm" th:href="@{/lcs(page=${page.number - 1},size=${size},sort=${sort},direction=${direction},id=${filters.id},name=${filters.name},heightMin=${filters.heightMin},heightMax=${filters.heightMax},widthMin=${filters.widthMin},widthMax=${filters.widthMax},depthMin=${filters.depthMin},depthMax=${filters.depthMax},displayPurpose=${filters.displayPurpose},accessPurpose=${filters.accessPurpose},paymentPurpose=${filters.paymentPurpose},printerPurpose=${filters.printerPurpose},colorBody=${filters.colorBody},colorDoor=${filters.colorDoor})}">Назад</a>
            <span class="small mx-2" th:text="${(page.number + 1) + ' / ' + page.totalPages}">1 / 1</span>
            <a th:if="${page.hasNext()}" class="btn btn-outline-secondary btn-sm" th:href="@{/lcs(page=${page.number + 1},size=${size},sort=${sort},direction=${direction},id=${filters.id},name=${filters.name},heightMin=${filters.heightMin},heightMax=${filters.heightMax},widthMin=${filters.widthMin},widthMax=${filters.widthMax},depthMin=${filters.depthMin},depthMax=${filters.depthMax},displayPurpose=${filters.displayPurpose},accessPurpose=${filters.accessPurpose},paymentPurpose=${filters.paymentPurpose},printerPurpose=${filters.printerPurpose},colorBody=${filters.colorBody},colorDoor=${filters.colorDoor})}">Вперёд</a>
        </div>
    </nav>
</main>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
