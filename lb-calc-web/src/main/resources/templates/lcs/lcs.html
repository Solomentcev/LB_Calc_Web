<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Модули управления')}"></head>
<body>
<div th:replace="~{header :: header}"></div>
<div class="container">
    <h1>Модули управления</h1>
    <a th:href="@{/lcs/create}" class="btn btn-primary btn-sm mb-3">Создать Модуль Управления </a>
    <a th:href="@{/}" class="btn btn-primary btn-sm mb-3">Назад</a>
    
    <div class="table-responsive">
    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Описание</th>
            <th>Высота</th>
            <th>Ширина</th>
            <th>Глубина</th>
            <th>Цвет корпуса</th>
            <th>Конфигурация</th>
            <th>Действие</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="lc: ${lcs}">
            <td th:text="${lc.getId()}">ID</td>
            <td th:text="${lc.getName()}">Name</td>
            <td th:text="${lc.getDescription()}">Description</td>
            <td th:text="${lc.getHeight()}">Height</td>
            <td th:text="${lc.getWidth()}">Width</td>
            <td th:text="${lc.getDepth()}">Depth</td>
            <td th:text="${lc.getColorBody()}">ColorBody</td>
            <td th:text="${lc.getDescription()}">Конфигурация</td>

            <td>
                <a th:href="@{/lcs/{id}(id=${lc.getId()})}" class="btn btn-primary btn-sm">Редактировать</a>
            </td>
        </tr>
        </tbody>
    </table>
        </div>
</div>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
