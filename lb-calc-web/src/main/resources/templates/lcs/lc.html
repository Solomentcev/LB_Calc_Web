<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Модуль управления')}"></head>
<body>
<div th:replace="~{header :: header}"></div>
<div>
    
    <form action="#" th:action="@{/lcs/save}"
          th:object="${lc}" method="post">
        <p  th:each="erorr, item: ${errors}" class="alert alert-danger"
            th:text="${item.current}"></p>

        <button type="submit" class="btn btn-primary btn-sm mb-3">Сохранить Модуль управления</button>
        <a th:href="@{'/lcs'}" class="btn btn-primary btn-sm mb-3">К списку модулей управления </a>
    
        <h1 class="h4" th:text="*{description}">Модуль управления</h1>
        <label hidden="hidden">
            <input size="180"  type="text" th:field="*{description}" readonly="readonly">
        </label>
    <div class="table-responsive">
    <table class="table table-striped">
            <tr>
                 <th>ID</th>
                 <td>
                    <label>
                         <input type="number" size="3" th:field="*{id}" readonly="readonly">
                     </label>
                 </td>
                <td rowspan="13">
                    <div class="container">
                        <img class="img-thumbnail"
                             th:src="'data:image/png;base64,'+${lc.getStringLCImage()}"
                             alt="LC Image">
                    </div>
                </td>
            </tr>
            <tr>
                <th>Название</th>
                <td>
                    <label>
                        <input  size="30" type="text" height="" th:field="*{name}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
               <th>Высота</th>
               <td>
                    <label>
                         <input type="number" size="4" th:field="*{height}">
                    </label>
              </td>
            </tr>
            <tr>
                 <th>Ширина</th>
                  <td>
                      <label>
                          <input type="number" size="4" th:field="*{width}" readonly="readonly">
                      </label>
                  </td>
            </tr>
            <tr>
                <th>Глубина</th>
                <td>
                        <label>
                            <input type="number" size="4" th:field="*{depth}">
                        </label>
                    </td>
            </tr>
        <tr>
            <th>Верхняя рама</th>
            <td>
                <label>
                    <input type="number" size="4" th:field="*{upperFrame}">
                </label>
            </td>
        </tr>
        <tr>
            <th>Нижняя рама</th>
            <td>
                <label>
                    <input type="number" size="4" th:field="*{bottomFrame}">
                </label>
            </td>
        </tr>
        <tr>
            <th>Цвет корпуса</th>
            <td>
                <label>
                    <select th:field="*{colorBody}">
                        <option th:each="color:${colorsList}"
                                th:value="${color}"
                                th:text="${color}">
                        </option>
                    </select>
                </label>
            </td>
        </tr>
        <tr>
            <th>Дисплей</th>
            <td>
                <label>
                    <select th:field="*{display}">
                        <option th:each="display:${displayList}" th:value="${display}" th:text="${display}">
                        </option>
                    </select>
                </label>
            </td>
        </tr>
        <tr>
            <th>Оплата</th>
            <td>
                <label>
                    <select th:field="*{payment}">
                        <option th:each="payment:${paymentList}" th:value="${payment}" th:text="${payment}">
                        </option>
                    </select>
                </label>
            </td>
        </tr>
        <tr>
            <th>Способы доступа</th>
            <td>
                <label>
                    <select multiple class="form-control" th:field="*{accessMethods}">
                        <option th:each="method : ${accessMethodList}"
                                th:value="${method}" th:text="${method}">
                        </option>
                    </select>
                </label>
            </td>
        </tr>
    </table>
    </div>
</form>
</div>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
