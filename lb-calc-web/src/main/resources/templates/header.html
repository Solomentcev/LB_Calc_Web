<header th:fragment="header"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <nav class="navbar navbar-dark bg-dark flex-wrap px-3 py-2">
        <a class="navbar-brand" th:href="@{/}">LB_Calc_Web</a>

        <ul class="navbar-nav flex-row flex-wrap mr-auto mb-0"
            sec:authorize="isAuthenticated()">
            <li class="nav-item">
                <a class="nav-link px-2" th:href="@{/myprofile}">Мой профиль</a>
            </li>
            <li class="nav-item">
                <a class="nav-link px-2" th:href="@{/projects}">Проекты</a>
            </li>
            <li class="nav-item">
                <a class="nav-link px-2" th:href="@{/alss}">АКХ</a>
            </li>
            <li class="nav-item">
                <a class="nav-link px-2" th:href="@{/lbs}">Модули хранения</a>
            </li>
            <li class="nav-item">
                <a class="nav-link px-2" th:href="@{/lcs}">Модули управления</a>
            </li>
            <li class="nav-item">
                <a class="nav-link px-2" th:href="@{/lbcs}">LBC</a>
            </li>
            <li class="nav-item">
                <a class="nav-link px-2" th:href="@{/profiles}">Профили сотрудников</a>
            </li>
            <li class="nav-item" sec:authorize="hasAuthority('ROLE_ADMIN')">
                <a class="nav-link px-2" th:href="@{/employees}">Сотрудники</a>
            </li>
        </ul>

        <ul class="navbar-nav flex-row flex-wrap align-items-center mb-0">
            <li class="nav-item" sec:authorize="isAnonymous()">
                <a class="nav-link px-2" th:href="@{/registration}">Регистрация</a>
            </li>
            <li class="nav-item" sec:authorize="isAnonymous()">
                <a class="nav-link px-2" th:href="@{/login}">Вход</a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <span class="navbar-text px-2">
                    <span sec:authentication="name"></span>
                </span>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
                <form th:action="@{/logout}" method="post" class="form-inline mb-0">
                    <button type="submit" class="nav-link btn btn-link px-2">Выход</button>
                </form>
            </li>
        </ul>
    </nav>
</header>
