<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Модель оборудования')}"></head>
<body>
<div th:replace="~{header :: header}"></div>
<div class="container">
    <h1 class="page-title" th:text="${equipment.id == null ? 'Добавление модели оборудования' : 'Редактирование модели оборудования'}"></h1>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <form th:action="@{/equipment/save}" th:object="${equipment}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="form-group">
            <label for="name">Название</label>
            <input id="name" type="text" class="form-control" th:field="*{name}" maxlength="255" required>
            <span class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>
        <div class="form-group">
            <label for="description">Описание</label>
            <textarea id="description" class="form-control" th:field="*{description}" rows="3" maxlength="4000"></textarea>
            <span class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
        </div>
        <div class="form-group">
            <label for="functionalType">Функциональный тип</label>
            <select id="functionalType" class="form-control" th:field="*{functionalType}" required>
                <option value="">Выберите тип</option>
                <option th:each="type : ${functionalTypes}" th:value="${type}" th:text="${type}"></option>
            </select>
            <span class="text-danger" th:if="${#fields.hasErrors('functionalType')}" th:errors="*{functionalType}"></span>
        </div>
        <div class="form-group">
            <label for="purpose">Назначение</label>
            <select id="purpose" class="form-control" th:field="*{purpose}" required>
                <option value="">Выберите назначение</option>
                <option th:each="purpose : ${purposes}" th:value="${purpose}" th:text="${purpose}"></option>
            </select>
            <span class="text-danger" th:if="${#fields.hasErrors('purpose')}" th:errors="*{purpose}"></span>
        </div>
        <div class="form-group">
            <label for="category">Категория</label>
            <select id="category" class="form-control" th:field="*{category}" required>
                <option value="">Выберите категорию</option>
                <option th:each="category : ${categories}" th:value="${category}" th:text="${category}"></option>
            </select>
            <span class="text-danger" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></span>
        </div>
        <div class="form-row">
            <div class="form-group col-md-4">
                <label for="width">Ширина, мм</label>
                <input id="width" type="number" min="0" class="form-control" th:field="*{width}" required>
                <span class="text-danger" th:if="${#fields.hasErrors('width')}" th:errors="*{width}"></span>
            </div>
            <div class="form-group col-md-4">
                <label for="height">Высота, мм</label>
                <input id="height" type="number" min="0" class="form-control" th:field="*{height}" required>
                <span class="text-danger" th:if="${#fields.hasErrors('height')}" th:errors="*{height}"></span>
            </div>
            <div class="form-group col-md-4">
                <label for="depth">Глубина, мм</label>
                <input id="depth" type="number" min="0" class="form-control" th:field="*{depth}" required>
                <span class="text-danger" th:if="${#fields.hasErrors('depth')}" th:errors="*{depth}"></span>
            </div>
        </div>
        <div class="page-actions">
            <button type="submit" class="btn btn-primary btn-sm">Сохранить</button>
            <a th:href="@{/equipment}" class="btn btn-secondary btn-sm">К каталогу</a>
        </div>
    </form>
</div>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
