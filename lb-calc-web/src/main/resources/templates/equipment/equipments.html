<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Каталог оборудования')}"></head>
<body>
<div th:replace="~{header :: header}"></div>
<div class="container">
    <h1 class="page-title">Каталог оборудования</h1>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
    <div class="page-actions">
        <a th:href="@{/equipment/create}" class="btn btn-primary btn-sm">Добавить модель</a>
        <a th:href="@{/}" class="btn btn-secondary btn-sm">Назад</a>
    </div>

    <form id="equipment-filter-form" th:action="@{/equipment}" method="get" class="mb-2">
        <input type="hidden" name="page" value="0">
        <input type="hidden" name="sort" th:value="${sort}">
        <input type="hidden" name="direction" th:value="${direction}">
        <input type="hidden" name="size" th:value="${size}">
        <div class="d-flex flex-wrap align-items-end mb-2" style="gap: .5rem">
            <button type="submit" class="btn btn-outline-primary btn-sm">Применить фильтры</button>
            <a th:href="@{/equipment}" class="btn btn-outline-secondary btn-sm">Сбросить</a>
        </div>
    </form>

    <form id="equipment-sort-form" th:action="@{/equipment}" method="get" class="form-inline mb-3">
        <input type="hidden" name="page" value="0">
        <input type="hidden" name="id" th:value="${filters.id}">
        <input type="hidden" name="name" th:value="${filters.name}">
        <input type="hidden" name="functionalType" th:value="${filters.functionalType}">
        <input type="hidden" name="category" th:value="${filters.category}">
        <input type="hidden" name="purpose" th:value="${filters.purpose}">
        <input type="hidden" name="widthMin" th:value="${filters.widthMin}">
        <input type="hidden" name="widthMax" th:value="${filters.widthMax}">
        <input type="hidden" name="heightMin" th:value="${filters.heightMin}">
        <input type="hidden" name="heightMax" th:value="${filters.heightMax}">
        <input type="hidden" name="depthMin" th:value="${filters.depthMin}">
        <input type="hidden" name="depthMax" th:value="${filters.depthMax}">
        <input type="hidden" name="description" th:value="${filters.description}">
        <label class="mr-2" for="catalog-sort">Сортировка</label>
        <select id="catalog-sort" class="form-control form-control-sm mr-2" name="sort">
            <option value="id" th:selected="${sort == 'id'}">ID</option>
            <option value="name" th:selected="${sort == 'name'}">Название</option>
            <option value="functionalType" th:selected="${sort == 'functionalType'}">Функциональный тип</option>
            <option value="category" th:selected="${sort == 'category'}">Категория</option>
            <option value="purpose" th:selected="${sort == 'purpose'}">Назначение</option>
            <option value="width" th:selected="${sort == 'width'}">Ширина</option>
            <option value="height" th:selected="${sort == 'height'}">Высота</option>
            <option value="depth" th:selected="${sort == 'depth'}">Глубина</option>
            <option value="description" th:selected="${sort == 'description'}">Описание</option>
        </select>
        <select class="form-control form-control-sm mr-2" name="direction" aria-label="Направление сортировки">
            <option value="asc" th:selected="${direction == 'asc'}">По возрастанию</option>
            <option value="desc" th:selected="${direction == 'desc'}">По убыванию</option>
        </select>
        <label class="mr-2" for="catalog-size">Строк</label>
        <select id="catalog-size" class="form-control form-control-sm mr-2" name="size">
            <option value="10" th:selected="${size == 10}">10</option>
            <option value="20" th:selected="${size == 20}">20</option>
            <option value="50" th:selected="${size == 50}">50</option>
            <option value="100" th:selected="${size == 100}">100</option>
        </select>
        <button class="btn btn-outline-primary btn-sm" type="submit">Применить</button>
    </form>

    <div class="table-responsive">
        <table class="table table-striped table-hover catalog-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Функциональный тип</th>
                <th>Категория</th>
                <th>Назначение</th>
                <th>Размеры (Ш × В × Г)</th>
                <th>Описание</th>
                <th>Действия</th>
            </tr>
            <tr>
                <th><input form="equipment-filter-form" class="form-control form-control-sm" type="number" min="1" name="id" th:value="${filters.id}" placeholder="ID"></th>
                <th><input form="equipment-filter-form" class="form-control form-control-sm" type="text" name="name" th:value="${filters.name}" placeholder="Содержит"></th>
                <th>
                    <select form="equipment-filter-form" class="form-control form-control-sm" name="functionalType">
                        <option value="">Все</option>
                        <option th:each="value : ${functionalTypes}" th:value="${value}" th:text="${value}" th:selected="${value == filters.functionalType}"></option>
                    </select>
                </th>
                <th>
                    <select form="equipment-filter-form" class="form-control form-control-sm" name="category">
                        <option value="">Все</option>
                        <option th:each="value : ${categories}" th:value="${value}" th:text="${value}" th:selected="${value == filters.category}"></option>
                    </select>
                </th>
                <th><input form="equipment-filter-form" class="form-control form-control-sm" type="text" name="purpose" th:value="${filters.purpose}" placeholder="Содержит"></th>
                <th>
                    <div class="d-flex" style="gap: .25rem">
                        <input form="equipment-filter-form" class="form-control form-control-sm" type="number" min="0" name="widthMin" th:value="${filters.widthMin}" placeholder="Ш от">
                        <input form="equipment-filter-form" class="form-control form-control-sm" type="number" min="0" name="widthMax" th:value="${filters.widthMax}" placeholder="Ш до">
                    </div>
                    <div class="d-flex mt-1" style="gap: .25rem">
                        <input form="equipment-filter-form" class="form-control form-control-sm" type="number" min="0" name="heightMin" th:value="${filters.heightMin}" placeholder="В от">
                        <input form="equipment-filter-form" class="form-control form-control-sm" type="number" min="0" name="heightMax" th:value="${filters.heightMax}" placeholder="В до">
                    </div>
                    <div class="d-flex mt-1" style="gap: .25rem">
                        <input form="equipment-filter-form" class="form-control form-control-sm" type="number" min="0" name="depthMin" th:value="${filters.depthMin}" placeholder="Г от">
                        <input form="equipment-filter-form" class="form-control form-control-sm" type="number" min="0" name="depthMax" th:value="${filters.depthMax}" placeholder="Г до">
                    </div>
                </th>
                <th><input form="equipment-filter-form" class="form-control form-control-sm" type="text" name="description" th:value="${filters.description}" placeholder="Содержит"></th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${equipmentList}">
                <td th:text="${item.id}"></td>
                <td th:text="${item.name}"></td>
                <td th:text="${item.functionalType}"></td>
                <td th:text="${item.category}"></td>
                <td th:text="${item.purpose}"></td>
                <td th:text="${item.width + ' × ' + item.height + ' × ' + item.depth}"></td>
                <td th:text="${item.description}"></td>
                <td>
                    <a th:href="@{/equipment/{id}(id=${item.id})}" class="btn btn-primary btn-sm">Изменить</a>
                    <form th:action="@{/equipment/{id}/delete(id=${item.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-danger btn-sm"
                                onclick="return confirm('Удалить модель оборудования?')">Удалить</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(equipmentList)}"><td colspan="8" class="text-center">Нет моделей, соответствующих фильтрам</td></tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${page.totalPages > 1}" aria-label="Навигация по страницам"
         class="d-flex align-items-center justify-content-between mb-3">
        <span class="text-muted small"
              th:text="${'Записи ' + (page.number * page.size + 1) + '–' + (page.number * page.size + page.numberOfElements) + ' из ' + page.totalElements}">Записи</span>
        <div>
            <a th:if="${page.hasPrevious()}" class="btn btn-outline-secondary btn-sm"
               th:href="@{/equipment(page=${page.number - 1},size=${size},sort=${sort},direction=${direction},id=${filters.id},name=${filters.name},functionalType=${filters.functionalType},category=${filters.category},purpose=${filters.purpose},widthMin=${filters.widthMin},widthMax=${filters.widthMax},heightMin=${filters.heightMin},heightMax=${filters.heightMax},depthMin=${filters.depthMin},depthMax=${filters.depthMax},description=${filters.description})}">Назад</a>
            <span class="small mx-2" th:text="${(page.number + 1) + ' / ' + page.totalPages}">1 / 1</span>
            <a th:if="${page.hasNext()}" class="btn btn-outline-secondary btn-sm"
               th:href="@{/equipment(page=${page.number + 1},size=${size},sort=${sort},direction=${direction},id=${filters.id},name=${filters.name},functionalType=${filters.functionalType},category=${filters.category},purpose=${filters.purpose},widthMin=${filters.widthMin},widthMax=${filters.widthMax},heightMin=${filters.heightMin},heightMax=${filters.heightMax},depthMin=${filters.depthMin},depthMax=${filters.depthMax},description=${filters.description})}">Вперёд</a>
        </div>
    </nav>
</div>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
