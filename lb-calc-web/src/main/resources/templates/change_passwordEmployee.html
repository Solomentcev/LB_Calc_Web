<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Смена пароля сотрудника')}"></head>
<body>
<div th:replace="~{header :: header}"></div>
<div class="container">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div th:if="${error}" class="alert alert-danger">
                <span th:text="${error}"></span>
            </div>

            <div th:if="${successMessage}!=null" class="alert alert-success">
                <span th:text="${successMessage}"></span>
            </div>
            <div class="card">
                <div class="card-header text-center">
                    <h2 class="text-center">Сменить пароль</h2>
                </div>
                <div class="card-body">
                    <form method="post" th:object="${changePassword}" th:action="@{/employees/{id}/changepassword (id=${id})}" class="form-horizontal">
                        <div class="form-group mb-3">
                            <label class="control-label" for="password">Пароль</label>
                            <input
                                    type="password"
                                    id="password"
                                    th:field="*{password}"
                                    class="form-control"
                                    placeholder="Введите пароль"
                            />
                            <div th:if="${#fields.hasErrors('password')}" class="text-danger">
                                <p th:each="e : ${#fields.errors('password')}" th:text="${e}"></p>
                            </div>
                        </div>

                        <div class="form-group mb-3">
                            <label class="control-label" for="confirmPassword">Повторите пароль</label>
                            <input
                                    type="password"
                                    id="confirmPassword"
                                    th:field="*{confirmPassword}"
                                    class="form-control"
                                    placeholder="Повторите пароль"
                            />
                            <div th:if="${#fields.hasErrors('confirmPassword')}" class="text-danger">
                                <p th:each="e : ${#fields.errors('confirmPassword')}" th:text="${e}"></p>
                            </div>
                        </div>
                        <div class="form-group mb-3">
                            <button type="submit" class="btn btn-primary btn-sm">Подтвердить</button>
                            <a th:href="@{/employees/{id} (id=${id})}" class="btn btn-secondary btn-sm">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
