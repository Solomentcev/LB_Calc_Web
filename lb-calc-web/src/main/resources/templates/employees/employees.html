<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Сотрудники')}"></head>
<body>
<div th:replace="~{header :: header}"></div>
<div class="container">
    <h1 class="page-title">Сотрудники</h1>
    <div class="page-actions">
        <a th:href="@{/employees/create}" class="btn btn-success btn-sm">Добавить сотрудника</a>
    </div>

    <form id="employee-filter-form" th:action="@{/employees}" method="get" class="mb-2">
        <input type="hidden" name="page" value="0">
        <input type="hidden" name="sort" th:value="${sort}">
        <input type="hidden" name="direction" th:value="${direction}">
        <input type="hidden" name="size" th:value="${size}">
        <button type="submit" class="btn btn-outline-primary btn-sm">Применить фильтры</button>
        <a th:href="@{/employees}" class="btn btn-outline-secondary btn-sm">Сбросить</a>
    </form>

    <form id="employee-sort-form" th:action="@{/employees}" method="get" class="form-inline mb-3">
        <input type="hidden" name="page" value="0">
        <input type="hidden" name="id" th:value="${filters.id}">
        <input type="hidden" name="firstName" th:value="${filters.firstName}">
        <input type="hidden" name="lastName" th:value="${filters.lastName}">
        <input type="hidden" name="email" th:value="${filters.email}">
        <input type="hidden" name="role" th:value="${filters.role}">
        <input type="hidden" name="active" th:value="${filters.active}">
        <input type="hidden" name="registrationDateFrom" th:value="${filters.registrationDateFrom}">
        <input type="hidden" name="registrationDateTo" th:value="${filters.registrationDateTo}">
        <label class="mr-2" for="employee-sort">Сортировка</label>
        <select id="employee-sort" class="form-control form-control-sm mr-2" name="sort">
            <option value="id" th:selected="${sort == 'id'}">ID</option>
            <option value="firstName" th:selected="${sort == 'firstName'}">Имя</option>
            <option value="lastName" th:selected="${sort == 'lastName'}">Фамилия</option>
            <option value="email" th:selected="${sort == 'email'}">Электронная почта</option>
            <option value="role" th:selected="${sort == 'role'}">Роль</option>
            <option value="active" th:selected="${sort == 'active'}">Статус</option>
            <option value="registrationDate" th:selected="${sort == 'registrationDate'}">Дата регистрации</option>
        </select>
        <select class="form-control form-control-sm mr-2" name="direction" aria-label="Направление сортировки">
            <option value="asc" th:selected="${direction == 'asc'}">По возрастанию</option>
            <option value="desc" th:selected="${direction == 'desc'}">По убыванию</option>
        </select>
        <label class="mr-2" for="employee-size">Строк</label>
        <select id="employee-size" class="form-control form-control-sm mr-2" name="size">
            <option value="10" th:selected="${size == 10}">10</option>
            <option value="20" th:selected="${size == 20}">20</option>
            <option value="50" th:selected="${size == 50}">50</option>
            <option value="100" th:selected="${size == 100}">100</option>
        </select>
        <button type="submit" class="btn btn-outline-primary btn-sm">Применить</button>
    </form>

    <div class="table-responsive">
        <table class="table table-striped table-hover catalog-table people-table">
            <colgroup>
                <col style="width:5%"><col style="width:11%"><col style="width:11%">
                <col style="width:24%"><col style="width:11%"><col style="width:13%">
                <col style="width:13%"><col style="width:12%">
            </colgroup>
            <thead>
            <tr>
                <th>ID</th><th>Имя</th><th>Фамилия</th><th>Электронная почта</th>
                <th>Роль</th><th>Статус</th><th>Дата регистрации</th><th>Действия</th>
            </tr>
            <tr>
                <th><input form="employee-filter-form" class="form-control form-control-sm" type="number" min="1" name="id" th:value="${filters.id}" placeholder="ID"></th>
                <th><input form="employee-filter-form" class="form-control form-control-sm" type="text" name="firstName" th:value="${filters.firstName}" placeholder="Содержит"></th>
                <th><input form="employee-filter-form" class="form-control form-control-sm" type="text" name="lastName" th:value="${filters.lastName}" placeholder="Содержит"></th>
                <th><input form="employee-filter-form" class="form-control form-control-sm" type="text" name="email" th:value="${filters.email}" placeholder="Содержит"></th>
                <th>
                    <select form="employee-filter-form" class="form-control form-control-sm" name="role">
                        <option value="">Все</option>
                        <option th:each="value : ${roles}" th:value="${value}" th:text="${value}" th:selected="${value == filters.role}"></option>
                    </select>
                </th>
                <th>
                    <select form="employee-filter-form" class="form-control form-control-sm" name="active">
                        <option value="">Все</option>
                        <option value="true" th:selected="${filters.active == true}">Активен</option>
                        <option value="false" th:selected="${filters.active == false}">Деактивирован</option>
                    </select>
                </th>
                <th>
                    <input form="employee-filter-form" class="form-control form-control-sm" type="date" name="registrationDateFrom" th:value="${filters.registrationDateFrom}" aria-label="Дата регистрации от">
                    <input form="employee-filter-form" class="form-control form-control-sm mt-1" type="date" name="registrationDateTo" th:value="${filters.registrationDateTo}" aria-label="Дата регистрации до">
                </th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="employee : ${employees}">
                <td th:text="${employee.id}"></td>
                <td th:text="${employee.firstName}"></td>
                <td th:text="${employee.lastName}"></td>
                <td th:text="${employee.email}"></td>
                <td th:text="${employee.role}"></td>
                <td>
                    <span th:if="${employeeStatuses[employee.id]}" class="badge badge-success">Активен</span>
                    <span th:unless="${employeeStatuses[employee.id]}" class="badge badge-secondary">Деактивирован</span>
                </td>
                <td th:text="${employee.registrationDate}"></td>
                <td><a th:href="@{'/employees/' + ${employee.id}}" class="btn btn-sm btn-primary">Открыть</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(employees)}"><td colspan="8" class="text-center">Нет сотрудников, соответствующих фильтрам</td></tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${page.totalPages > 1}" aria-label="Навигация по страницам"
         class="d-flex align-items-center justify-content-between mb-3">
        <span class="text-muted small" th:text="${'Записи ' + (page.number * page.size + 1) + '–' + (page.number * page.size + page.numberOfElements) + ' из ' + page.totalElements}">Записи</span>
        <div>
            <a th:if="${page.hasPrevious()}" class="btn btn-outline-secondary btn-sm"
               th:href="@{/employees(page=${page.number - 1},size=${size},sort=${sort},direction=${direction},id=${filters.id},firstName=${filters.firstName},lastName=${filters.lastName},email=${filters.email},role=${filters.role},active=${filters.active},registrationDateFrom=${filters.registrationDateFrom},registrationDateTo=${filters.registrationDateTo})}">Назад</a>
            <span class="small mx-2" th:text="${(page.number + 1) + ' / ' + page.totalPages}">1 / 1</span>
            <a th:if="${page.hasNext()}" class="btn btn-outline-secondary btn-sm"
               th:href="@{/employees(page=${page.number + 1},size=${size},sort=${sort},direction=${direction},id=${filters.id},firstName=${filters.firstName},lastName=${filters.lastName},email=${filters.email},role=${filters.role},active=${filters.active},registrationDateFrom=${filters.registrationDateFrom},registrationDateTo=${filters.registrationDateTo})}">Вперёд</a>
        </div>
    </nav>
</div>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
