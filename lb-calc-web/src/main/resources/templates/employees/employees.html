<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Сотрудники')}"></head>
<body>
<div th:replace="~{header :: header}"></div>
    <div class="container">
        <h1>Сотрудники</h1>
        <div class="page-actions">
            <a th:href="@{/employees/create}" class="btn btn-success btn-sm">Добавить нового сотрудника</a>
        </div>

        <div class="table-responsive">
        <table class="table table-striped js-data-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Фамилия</th>
                <th>Электронная почта</th>
                <th>Роль</th>
                <th>Статус</th>
                <th>Дата регистрации</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="employee : ${employees}">
                <td th:text="${employee.id}"></td>
                <td th:text="${employee.firstName}"></td>
                <td th:text="${employee.lastName}"></td>
                <td th:text="${employee.email}"></td>
                <td th:text="${employee.role}"></td>
                <td>
                    <span th:if="${employeeStatuses[employee.id]}" class="badge badge-success">Активен</span>
                    <span th:unless="${employeeStatuses[employee.id]}" class="badge badge-secondary">Деактивирован</span>
                </td>
                <td th:text="${employee.registrationDate}"></td>
                <td>
                    <a th:href="@{'/employees/' + ${employee.id}}" class="btn btn-sm btn-primary">Открыть</a>

                </td>
            </tr>
            </tbody>
        </table>
        </div>
    </div>
    <div th:replace="~{footer :: footer}"></div>
</body>
</html>
