<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head('Сотрудник')}"></head>
<body>
<div th:replace="~{header :: header}"></div>

<div class="container">
    <h2>Сотрудник</h2>
    <div th:if="${successMessage}!=null" class="alert alert-success">
        <span th:text="${successMessage}"></span>
    </div>
    <form id="employee-update-form"
          th:action="@{/employees/{id}/update (id=${id})}"
          th:object="${employee}" method="post">
        <div th:if="${id!=null}" class="form-group">
            <label>ID</label>
            <input type="text" class="form-control" th:field="*{id}"  readonly="readonly"/>
        </div>
        <div class="form-group">
            <label>Имя</label>
            <input type="text" class="form-control" th:field="*{firstName}" required>
            <span class="text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
        </div>

        <div class="form-group">
            <label>Фамилия</label>
            <input type="text" class="form-control" th:field="*{lastName}" required>
            <span class="text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
        </div>

        <div class="form-group" >
            <label>Электронная почта</label>
            <input type="email" class="form-control" th:field="*{email}" required>
            <span class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="form-group">
            <label>Дата регистрации</label>
            <input type="text" class="form-control" th:field="*{registrationDate}" required readonly="readonly"/>
            <span class="text-danger" th:if="${#fields.hasErrors('registrationDate')}" th:errors="*{registrationDate}"></span>
        </div>

        <div class="form-group">
            <label>Роль</label>
            <select class="form-control" th:field="*{role}" required>
                <option th:each="role : ${roles}"
                        th:value="${role}"
                        th:text="${role}"
                        th:selected="${role == employee.role}"></option>
            </select>
        </div>
        <div class="alert"
             th:classappend="${active} ? ' alert-success' : ' alert-secondary'">
            <span th:if="${active}">Учётная запись активна</span>
            <span th:unless="${active}">Учётная запись деактивирована</span>
        </div>
        <div class="mb-3">
            <button type="submit" form="employee-update-form"
                    class="btn btn-primary btn-sm">Сохранить</button>
            <a th:href="@{/employees}" class="btn btn-secondary btn-sm">Отмена</a>
        </div>
    </form>

    <div class="mb-3">
        <form th:if="${active}"
              th:action="@{/employees/{id}/deactivate(id=${id})}"
              method="post" class="d-inline">
            <button type="submit" class="btn btn-danger btn-sm"
                    onclick="return confirm('Деактивировать учётную запись?')">
                Деактивировать
            </button>
        </form>
        <form th:unless="${active}"
              th:action="@{/employees/{id}/activate(id=${id})}"
              method="post" class="d-inline">
            <button type="submit" class="btn btn-success btn-sm">
                Активировать
            </button>
        </form>
        <a th:href="@{/employees/{id}/changepassword (id=${id})}" class="btn btn-primary btn-sm">
            Сменить пароль
        </a>
    </div>
</div>

<div th:replace="~{footer :: footer}"></div>
</body>
</html>
