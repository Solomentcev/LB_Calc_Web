# Database
# Use a separate database for tests to avoid modifying the development schema.
spring.datasource.url=${DB_TEST_URL:jdbc:mysql://localhost:3308/lb_calc_web_test?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_TEST_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${DB_TEST_PASSWORD:${DB_PASSWORD:${MYSQL_ROOT_PASSWORD:}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Keep the schema aligned with the entities in this baseline.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Flyway is not part of the current master baseline.
spring.flyway.enabled=false

# JWT test-only values; never use these secrets outside tests.
jwt.secret.access=${JWT_SECRET_ACCESS:VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdUZXN0U2VjcmV0Rm9yQUNjZXNz}
jwt.secret.refresh=${JWT_SECRET_REFRESH:VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdUZXN0U2VjcmV0Rm9yUmVmcmVzaA==}
jwt.expiration.access=${JWT_EXPIRATION_ACCESS:36000000}
jwt.expiration.refresh=${JWT_EXPIRATION_REFRESH:252000000}

# Kafka
app.kafka.topic.user-events=${KAFKA_TOPIC_USER_EVENTS:user-events-topic}
spring.kafka.producer.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
