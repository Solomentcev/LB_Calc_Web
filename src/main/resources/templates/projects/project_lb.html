<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>LB_Calc_WEB</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>
<div th:replace="~{header :: header}"></div>
<div class="container">
    <br/>
    <form action="#" th:action="@{/projects/{projectId}/alss/{alsId}/lbs/{lbId}/save
         (projectId=${project.getId()}, alsId=${als.getId()},lbId=${lb.getId})}"
          th:object="${lb}" method="post">
        <button type="submit" class="btn btn-primary btn-sm mb-3">Сохранить Модуль хранения</button>
        <a th:href="@{/projects/{projectId}/alss/{alsId} (projectId=${project.getId()},alsId=${als.getId()})}"
           class="btn btn-primary btn-sm mb-3"
           th:text="'Back to #'+${als.id}+'-'+${als.name}">Back to ALS</a>
        <a th:href="@{/projects/{projectId} (projectId=${project.getId()})}"
           class="btn btn-primary btn-sm mb-3"
           th:text="'Back to #'+${project.id}+'-'+${project.name}">Back to Project </a>
        <br/>
        <h4 th:text="*{description}">Модуль хранения</h4>
        <label hidden="hidden">
            <input size="130"  type="text" th:field="*{description}" readonly="readonly">
        </label>
        <table border="1" class="table table-striped table-responsive-md">
            <tr>
                <th >ID</th>
                <td>
                    <label>
                        <input type="text" size="3" th:field="*{id}" readonly="readonly">
                    </label>
                </td>
                <td rowspan="16">
                    <div class="container-fluid">
                        <img class="img-thumbnail" th:src="'data:image/png;base64,'+${lb.getStringLBImage()}" alt="LB Image">
                    </div>
                </td>
            </tr>
            <tr>
                <th>Name</th>
                <td>
                    <label>
                        <input  size="30" type="text" height="" th:field="*{name}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>Type</th>
                <td>
                    <label>
                        <select th:field="*{type}">
                            <option th:each="type:${typeLbList}"
                                    th:value="${type}"
                                    th:text="${type}">
                            </option>
                        </select>
                    </label>
                </td>
            </tr>
            <tr>
                <th>ShelfThick</th>
                <td>
                    <label>
                        <input type="text" size="3" th:field="*{shelfThick}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>CountCells</th>
                <td>
                    <label>
                        <input type="text" size="3" th:field="*{countCells}">
                    </label>
                </td>
            </tr>
            <tr>
                <th>Height</th>
                <td>
                    <label>
                        <input type="text" size="4" th:field="*{height}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>Width</th>
                <td>
                    <label>
                        <input type="text" size="4" th:field="*{width}">
                    </label>
                </td>
            </tr>
            <tr>
                <th>Depth</th>
                <td>
                    <label>
                        <input type="text" size="4" th:field="*{depth}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>UpperFrame</th>
                <td>
                    <label>
                        <input type="text" size="4" th:field="*{upperFrame}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>BottomFrame</th>
                <td>
                    <label>
                        <input type="text" size="4" th:field="*{bottomFrame}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>HeightCell</th>
                <td>
                    <label>
                        <input  type="text" size="4" th:field="*{heightCell}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>WidthCell</th>
                <td>
                    <label>
                        <input type="text" size="4" th:field="*{widthCell}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>DepthCell</th>
                <td>
                    <label>
                        <input type="text" size="4" th:field="*{depthCell}" readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>DirectionDoorOpening</th>
                <td>
                    <label>
                        <!-- <select th:field="*{directionDoorOpening}">
                            <option th:each="directionDoorOpening:${directionDoorOpeningList}"
                                    th:value="${directionDoorOpening}"
                                    th:text="${directionDoorOpening}">
                            </option>
                        </select></!-->
                        <input type="text" th:field="*{directionDoorOpening}"
                               readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>ColorBody</th>
                <td>
                    <label>
                        <!-- <select th:field="*{colorBody}">
                            <option th:each="color:${colorsList}" th:value="${color}" th:text="${color}">
                            </option>
                        </select></!-->
                        <input type="text" th:field="*{colorBody}"
                                   readonly="readonly">
                    </label>
                </td>
            </tr>
            <tr>
                <th>ColorDoor</th>
                <td>
                    <label>
                        <!-- <select th:field="*{colorDoor}">
                            <option th:each="color:${colorsList}" th:value="${color}" th:text="${color}">
                            </option>
                        </select></!-->
                        <input type="text" th:field="*{colorDoor}"
                               readonly="readonly">
                    </label>
                </td>
            </tr>
        </table>
    </form>
</div>
<div th:replace="~{footer :: footer}"></div>
</body>
</html>
