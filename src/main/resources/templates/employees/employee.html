<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>LB_Calc_WEB</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>
<div th:replace="~{header :: header}"></div>

<div class="container mt-4">
    <h2 th:text="Сотрудник"></h2>

    <form  th:action="@{/employees/{id}/update (id=${id})}"

          th:object="${employee}" method="post">
        <div th:if="${id!=null}" class="form-group">
            <label>id</label>
            <input type="text" class="form-control" th:field="*{id}"  readonly="readonly"/>
        </div>
        <div class="form-group">
            <label>First Name</label>
            <input type="text" class="form-control" th:field="*{firstName}" required>
            <span class="text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
        </div>

        <div class="form-group">
            <label>Last Name</label>
            <input type="text" class="form-control" th:field="*{lastName}" required>
            <span class="text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
        </div>

        <div class="form-group" >
            <label>Email</label>
            <input type="email" class="form-control" th:field="*{email}" required>
            <span class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="form-group" th:unless="${id != null}">
            <label>Password</label>
            <input type="password" class="form-control" th:field="*{password}" required>
            <span class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>

        <div class="form-group">
            <label>Role</label>
            <select class="form-control" th:field="*{role}" required>
                <option th:each="role : ${roles}"
                        th:value="${role}"
                        th:text="${role}"
                        th:selected="${role == employee.role}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary"
                th:text="${id != null ? 'Update' : 'Save'}"></button>
        <a th:href="@{/employees}" class="btn btn-secondary">Cancel</a>
    </form>
</div>

<div th:replace="~{footer :: footer}"></div>
</body>
</html>
