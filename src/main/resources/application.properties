spring.application.name=LB_Calc_Web

spring.datasource.url=jdbc:mysql://localhost:3307/lb_web_mysql_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql= true
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.properties.hibernate.type.descriptor.sql=true
#Turn Statistics on
logging.level.org.hibernate.stat=trace
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS

logging.level.com.lb_calc_web=TRACE